<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What's on · The Paper Moth</title>
<!-- Direction 2: Posters in the window. Every event gets a woodtype poster generated from its own words; no photos needed. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,400..900&family=Atkinson+Hyperlegible+Next:ital,wght@0,400..700;1,400&display=swap" rel="stylesheet">
<style>
@layer reset, tokens, base, layout, components;

@layer reset {
  *, *::before, *::after { box-sizing: border-box; }
  body, h1, h2, h3, p, dl, dd, ul { margin: 0; }
  ul { padding: 0; list-style: none; }
  svg { display: block; }
  button, input { font: inherit; color: inherit; }
}

@layer tokens {
  :root {
    /* raw */
    --kraft: #E8DDC7; --kraft-dark: #D9CBB0; --paper: #FFFBF3;
    --ink: #22170F; --ink-soft: #5E4E40; --cream: #FFF4E2;
    --tomato: #B83A22; --tomato-deep: #962C18;
    --bottle: #1F4B3B; --bottle-deep: #163828;
    --sun: #F2B632; --sun-deep: #D79A12;
    --stamp: #B3261E; --focus: #1A56C4;
    /* roles */
    --bg: var(--kraft); --surface: var(--paper); --text: var(--ink); --muted: var(--ink-soft);
    --line: var(--kraft-dark); --action: var(--ink); --action-text: var(--cream);
    /* poster colour by event type: colour is identity, never the only signal */
    --author-bg: var(--tomato); --author-fg: var(--cream); --author-orn: var(--tomato-deep);
    --club-bg: var(--bottle); --club-fg: var(--cream); --club-orn: var(--bottle-deep);
    --story-bg: var(--sun); --story-fg: var(--ink); --story-orn: var(--sun-deep);
    /* type */
    --display: "Anybody", "Arial Narrow", "Helvetica Neue Condensed", Impact, sans-serif;
    --body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", "Segoe UI", Roboto, sans-serif;
    --fs-body: 1.125rem;
    --s1: 0.25rem; --s2: 0.5rem; --s3: 0.75rem; --s4: 1rem; --s5: 1.5rem; --s6: 2.5rem; --s7: 4rem;
  }
}

@layer base {
  body { background: var(--bg); color: var(--text); font-family: var(--body); font-size: var(--fs-body); line-height: 1.5;
    background-image: radial-gradient(rgba(80, 55, 25, .07) 1px, transparent 1.2px); background-size: 5px 5px; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
}

@layer layout {
  .wrap { max-width: 72rem; margin-inline: auto; padding-inline: 16px; }
  @media (min-width: 700px) { .wrap { padding-inline: 32px; } }
}

@layer components {
  /* header: the shop name set like the fascia over the window */
  .top .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s4); padding-block: var(--s4); }
  .brand { text-decoration: none; font-family: var(--display); font-weight: 900; font-stretch: 130%; font-size: 1.35rem; line-height: .95; text-transform: uppercase; letter-spacing: -0.01em; }
  .brand span { display: block; font-size: .62em; font-stretch: 100%; font-weight: 700; letter-spacing: .08em; }
  .nav { display: flex; gap: var(--s2); white-space: nowrap; }
  .nav a { font-family: var(--display); font-weight: 750; font-stretch: 80%; text-transform: uppercase; letter-spacing: .04em; font-size: 1rem; text-decoration: none; padding: .45rem .7rem; border: 2px solid var(--ink); border-radius: 3px; }
  .nav a[aria-current] { background: var(--ink); color: var(--cream); }

  .intro { padding-block: var(--s4) var(--s5); }
  .intro h1 { font-family: var(--display); font-weight: 900; font-stretch: 55%; font-size: clamp(3rem, 2rem + 6vw, 6rem); line-height: .85; text-transform: uppercase; }
  .intro p { margin-top: var(--s3); max-width: 34rem; }

  /* the window: a grid of posters */
  .window { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 14px; padding-block: var(--s3) var(--s6); }
  @media (min-width: 760px) { .window { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 34px 26px; } }
  .window > li:first-child { grid-column: span 2; }
  @media (min-width: 760px) { .window > li:first-child { grid-row: span 2; } }
  /* each slot is a size container, so a poster's type scales with the poster, not the screen */
  .window > li, .strip > li, .hero { container-type: inline-size; }

  /* ----- poster ----- */
  .poster { --bgc: var(--author-bg); --fg: var(--author-fg); --orn: var(--author-orn);
    position: relative; display: flex; flex-direction: column; min-height: 100%;
    background: var(--bgc); color: var(--fg); text-decoration: none; padding: 7cqi 7cqi 0; overflow: visible;
    box-shadow: 0 1px 0 rgba(0,0,0,.08), 0 8px 18px -10px rgba(60,35,10,.55); transform: rotate(var(--tilt, 0deg)); transition: transform .18s; }
  .poster[data-type="club"] { --bgc: var(--club-bg); --fg: var(--club-fg); --orn: var(--club-orn); }
  .poster[data-type="story"] { --bgc: var(--story-bg); --fg: var(--story-fg); --orn: var(--story-orn); }
  li:nth-child(4n+2) .poster { --tilt: 1.2deg; } li:nth-child(4n+3) .poster { --tilt: -1deg; } li:nth-child(4n) .poster { --tilt: .6deg; } li:nth-child(4n+5) .poster { --tilt: -.5deg; }
  a.poster:hover { transform: rotate(0deg) translateY(-3px); }
  @media (prefers-reduced-motion: reduce) { .poster { transition: none; } }
  /* masking tape */
  .poster::before, .poster::after { content: ""; position: absolute; top: -9px; width: 22%; height: 18px; background: rgba(245, 236, 210, .78); box-shadow: 0 1px 1px rgba(0,0,0,.08); }
  .poster::before { left: 8%; transform: rotate(-6deg); } .poster::after { right: 8%; transform: rotate(5deg); }
  .orn { position: absolute; right: -2cqi; top: 22cqi; width: 58cqi; height: 58cqi; color: var(--orn); pointer-events: none; }
  .p-kind, .p-day, .p-num, .p-title, .p-sub, .p-time, .p-foot { position: relative; }
  .p-kind { font-family: var(--display); font-weight: 800; font-stretch: 120%; text-transform: uppercase; letter-spacing: .06em; font-size: max(11px, 6.2cqi); line-height: 1.1; }
  .p-day { font-family: var(--display); font-weight: 800; font-stretch: 100%; text-transform: uppercase; font-size: max(13px, 9cqi); line-height: 1; margin-top: 5cqi; }
  .p-num { font-family: var(--display); font-weight: 900; font-stretch: 60%; font-size: 40cqi; line-height: .8; margin-top: 1cqi; letter-spacing: -0.02em; }
  .p-num small { font-size: .3em; font-stretch: 100%; letter-spacing: 0; margin-left: .15em; vertical-align: .15em; }
  .p-title { font-family: var(--display); font-weight: 850; font-stretch: 52%; text-transform: uppercase; font-size: 13.5cqi; line-height: .9; margin-top: 5cqi; text-wrap: balance; }
  .p-sub { font-family: var(--display); font-weight: 600; font-stretch: 80%; font-size: max(12px, 6cqi); line-height: 1.15; margin-top: 3cqi; }
  .p-time { font-family: var(--display); font-weight: 800; font-stretch: 100%; font-size: max(13px, 8cqi); margin-top: 3cqi; }
  .p-foot { margin: auto -7cqi 0; padding: 4cqi 7cqi; border-top: 2px dashed currentColor; font-family: var(--display); font-weight: 800; font-stretch: 90%; text-transform: uppercase; font-size: max(12px, 6.6cqi); line-height: 1.1; margin-top: 6cqi; display: flex; justify-content: space-between; gap: 2cqi; }
  /* stickers and stamps: the entry answer, stuck on in words */
  .sticker { position: absolute; z-index: 2; right: 1cqi; top: 34cqi; width: 34cqi; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; text-align: center; transform: rotate(10deg);
    font-family: var(--display); font-weight: 900; font-stretch: 75%; text-transform: uppercase; font-size: max(11px, 6.4cqi); line-height: .95; background: var(--cream); color: var(--ink); box-shadow: 0 2px 4px rgba(0,0,0,.25); padding: 3cqi; }
  .sticker.few { background: #FFE14D; }
  .sticker.drop { background: var(--cream); color: var(--bottle); border: 2px dashed var(--bottle); }
  .stamp { position: absolute; z-index: 2; left: 5cqi; bottom: 1.5cqi; transform: rotate(-4deg); border: 4px double var(--stamp); color: var(--stamp); background: rgba(255, 244, 226, .92);
    font-family: var(--display); font-weight: 900; font-stretch: 110%; text-transform: uppercase; font-size: max(15px, 10.5cqi); padding: 1cqi 4cqi; white-space: nowrap; letter-spacing: .04em; }
  .poster.is-soldout > :not(.stamp) { opacity: .92; }

  /* visit handbill */
  .handbill { background: var(--surface); padding: var(--s5); max-width: 34rem; box-shadow: 0 8px 18px -12px rgba(60,35,10,.5); margin-block: var(--s4) var(--s7); }
  .handbill h2, .card h2, .prose h2 { font-family: var(--display); font-weight: 850; font-stretch: 70%; text-transform: uppercase; font-size: 1.6rem; line-height: 1; margin-bottom: var(--s3); }
  .handbill dl { display: grid; grid-template-columns: auto 1fr; gap: var(--s1) var(--s4); }
  .handbill dt { color: var(--muted); }
  .key { display: grid; gap: var(--s3); margin-top: var(--s4); padding-top: var(--s4); border-top: 2px dashed var(--line); }
  .key li { display: grid; grid-template-columns: 5.5rem 1fr; gap: var(--s3); align-items: center; font-size: 1rem; }
  .key .chip { font-family: var(--display); font-weight: 900; font-stretch: 75%; text-transform: uppercase; font-size: .85rem; text-align: center; padding: .3rem .2rem; line-height: 1; }
  .chip.drop { border: 2px dashed var(--bottle); color: var(--bottle); background: var(--cream); }
  .chip.few { background: #FFE14D; }
  .chip.sold { border: 3px double var(--stamp); color: var(--stamp); background: var(--cream); }

  .foot { padding-block: var(--s5) var(--s7); font-size: .95rem; color: var(--muted); }

  /* ----- event page ----- */
  .back { display: inline-block; font-family: var(--display); font-weight: 750; font-stretch: 85%; text-transform: uppercase; letter-spacing: .04em; font-size: .95rem; padding-block: var(--s2); margin-bottom: var(--s4); }
  .ev-layout { display: grid; gap: var(--s5); }
  .ev-layout > * { min-width: 0; }
  @media (min-width: 900px) { .ev-layout { grid-template-columns: minmax(0, 26rem) minmax(0, 1fr); gap: var(--s6); align-items: start; } .ev-layout .hero { position: sticky; top: var(--s5); } }
  .hero .poster { --tilt: 0deg; padding-top: 6cqi; }
  .hero .p-num { font-size: 32cqi; }
  .hero .p-title { font-size: 12cqi; }
  .card { background: var(--surface); padding: var(--s5); box-shadow: 0 8px 18px -12px rgba(60,35,10,.5); }
  .answer { font-weight: 700; font-size: 1.3rem; line-height: 1.25; }
  .answer + p { margin-top: var(--s2); color: var(--muted); }
  .btn { display: flex; justify-content: center; align-items: center; width: 100%; min-height: 54px; margin-top: var(--s4); border: 0; border-radius: 3px; background: var(--action); color: var(--action-text); cursor: pointer; text-decoration: none;
    font-family: var(--display); font-weight: 850; font-stretch: 90%; text-transform: uppercase; letter-spacing: .04em; font-size: 1.15rem; box-shadow: 0 3px 0 #000; }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
  .btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--ink); box-shadow: none; }
  .fine { font-size: .95rem; color: var(--muted); margin-top: var(--s3); }
  .wait { display: grid; gap: var(--s2); margin-top: var(--s4); }
  .wait input { width: 100%; min-width: 0; min-height: 50px; border: 2px solid var(--ink); border-radius: 3px; padding-inline: var(--s3); background: #fff; }
  .wait .btn { margin-top: 0; }
  .facts { display: grid; gap: var(--s3); margin-top: var(--s5); padding-top: var(--s4); border-top: 2px dashed var(--line); }
  .facts div { display: grid; grid-template-columns: 4.6rem 1fr; gap: var(--s3); }
  .facts dt { font-family: var(--display); font-weight: 800; font-stretch: 80%; text-transform: uppercase; letter-spacing: .05em; font-size: .9rem; padding-top: 3px; }
  .facts dd span { display: block; color: var(--muted); font-size: 1rem; }
  .minor { display: flex; gap: var(--s4); margin-top: var(--s4); }
  .minor button { background: none; border: 0; padding: var(--s2) 0; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .prose { margin-top: var(--s6); max-width: 36rem; }
  .prose p + p, .prose dl { margin-top: var(--s4); }
  .prose dt { font-weight: 700; } .prose dd + dt { margin-top: var(--s3); }
  .more { margin-top: var(--s7); }
  .more h2 { font-family: var(--display); font-weight: 900; font-stretch: 55%; text-transform: uppercase; font-size: 2.6rem; line-height: .9; }
  .strip { display: grid; grid-auto-flow: column; grid-auto-columns: 46%; gap: 16px; overflow-x: auto; padding: 22px 4px 18px; scroll-snap-type: x mandatory; }
  .strip > li { scroll-snap-align: start; }
  @media (min-width: 760px) { .strip { grid-auto-columns: 220px; } }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---------- Shared content and helpers (identical in all three directions) ---------- */
/* The prototype pretends today is Saturday 26 September 2026. */
const TODAY = new Date(2026, 8, 26);

const SHOP = {
  name: "The Paper Moth",
  street: "41 Tanner's Lane",
  town: "Ashbury",
  phone: "01632 960 418",
  hours: [["Monday to Saturday", "9:30am to 6pm"], ["Sunday", "11am to 4pm"]],
  owners: "Nell and Tomasz"
};

const TYPES = {
  author: { label: "Author event", plural: "Author events" },
  club:   { label: "Book club",    plural: "Book club" },
  story:  { label: "Story hour",   plural: "Story hours" }
};

const ROOMS = {
  long: { name: "The Long Room, upstairs", access: "The Long Room is up 16 stairs and there is no lift. If stairs are hard for you, ring us and we will keep you a seat downstairs by the door, with the talk on a speaker." },
  corner: { name: "The children's corner, ground floor", access: "Ground floor, step-free from the street. Buggies can park by the till." }
};

const STORY_TEXT = "Tomasz reads three picture books and then everyone makes something to take home. For children aged 2 to 6, with a grown-up. We start at 10:30 sharp and finish by 11:15.";

const EVENTS = [
  { id: "book-club-piranesi", type: "club", date: "2026-10-01", start: "19:00", end: "20:30",
    title: "Book club: Piranesi", subject: "Piranesi by Susanna Clarke", host: "Hosted by Nell",
    entry: "freebook", cap: 14, left: 5, room: "long", age: "Adults",
    blurb: [
      "This month we are reading Piranesi by Susanna Clarke: a man lives in a house of endless halls and tides, and keeps careful notes on everything he finds. It is short, strange, and one of Nell's favourite books.",
      "Come even if you have not finished it. Book club members get 10% off their copy. Tea, and biscuits from Hollis's bakery next door."
    ] },
  { id: "story-3-oct", type: "story", date: "2026-10-03", start: "10:30", end: "11:15",
    title: "Owls, moths and other night-time friends", host: "Read by Tomasz",
    entry: "dropin", room: "corner", age: "Ages 2 to 6",
    blurb: [STORY_TEXT, "This week: creatures who come out after dark. Everyone makes a paper moth."] },
  { id: "imogen-hale", type: "author", date: "2026-10-08", start: "19:00", end: "20:15", doors: "18:40",
    title: "Imogen Hale: The Salt Orchard", subject: "Imogen Hale reads from her new novel", host: "In conversation with Nell",
    entry: "ticket", price: 6, redeem: true, cap: 40, left: 4, room: "long", age: "Adults",
    blurb: [
      "Imogen Hale's first novel, The Glasshouse Year, was the book our customers pressed on each other all last winter. Her second, The Salt Orchard, follows three sisters who inherit a failing apple orchard on the Norfolk coast, and the sea that is slowly taking it.",
      "Imogen will read two short passages, talk with Nell about writing a family you love and argue with, and take your questions. Afterwards she will sign books. Bring your old copies too."
    ] },
  { id: "story-10-oct", type: "story", date: "2026-10-10", start: "10:30", end: "11:15",
    title: "Small dragons, big feelings", host: "Read by Tomasz",
    entry: "dropin", room: "corner", age: "Ages 2 to 6",
    blurb: [STORY_TEXT, "This week: dragons who are cross, shy, or very excited. Everyone makes a dragon mask."] },
  { id: "dev-okafor", type: "author", date: "2026-10-14", start: "19:00", end: "20:30",
    title: "Dev Okafor: Weather for Beginners", subject: "Launch of Dev Okafor's first book of poems", host: "With music from Aisling Byrne",
    entry: "freebook", cap: 45, left: 0, room: "long", age: "Adults",
    blurb: [
      "Dev Okafor ran the Sunday poetry nights at the Crown for six years, and half of Ashbury has heard these poems out loud. Now they are a book, and we are hosting the launch.",
      "Dev will read for about forty minutes, with fiddle tunes from Aisling Byrne in between. Free drinks, and a lot of cheering."
    ] },
  { id: "story-17-oct", type: "story", date: "2026-10-17", start: "10:30", end: "11:15",
    title: "Conkers, leaves and a very lost squirrel", host: "Read by Tomasz",
    entry: "dropin", room: "corner", age: "Ages 2 to 6",
    blurb: [STORY_TEXT, "This week: autumn stories. Bring a leaf you like."] },
  { id: "story-24-oct", type: "story", date: "2026-10-24", start: "10:30", end: "11:15",
    title: "Under the sea, and under the bed", host: "Read by Tomasz",
    entry: "dropin", room: "corner", age: "Ages 2 to 6",
    blurb: [STORY_TEXT, "This week: things that live in deep, dark places. Everyone makes a paper fish."] },
  { id: "ghosts-of-tanners-lane", type: "author", date: "2026-10-29", start: "19:30", end: "21:00",
    title: "The Ghosts of Tanner's Lane", subject: "A talk by local historian Ruth Penhallow", host: "Lights low",
    entry: "ticket", price: 8, extra: "includes a cup of mulled apple", cap: 50, left: 22, room: "long", age: "Adults, and brave teenagers",
    blurb: [
      "Ruth Penhallow has spent twenty years in the city archive. She will tell the stories behind the ghosts said to haunt our street, including the one who is supposed to rearrange our poetry shelf at night.",
      "The lights will be low and the stories are true, or at least written down. A cup of mulled apple is included."
    ] },
  { id: "story-31-oct", type: "story", date: "2026-10-31", start: "10:30", end: "11:15",
    title: "Not-too-scary stories for Halloween", host: "Read by Tomasz", note: "Costumes welcome",
    entry: "dropin", room: "corner", age: "Ages 2 to 6",
    blurb: [STORY_TEXT, "This week: friendly ghosts and a pumpkin with hiccups. Costumes very welcome."] }
];

const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const NUM_WORDS = ["no", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten"];

function dateOf(e) { const [y, m, d] = e.date.split("-").map(Number); return new Date(y, m - 1, d); }
function dayName(e) { return DAYS[dateOf(e).getDay()]; }
function dayShort(e) { return dayName(e).slice(0, 3); }
function dayNum(e) { return dateOf(e).getDate(); }
function monthName(e) { return MONTHS[dateOf(e).getMonth()]; }
function monthShort(e) { return monthName(e).slice(0, 3); }
function longDate(e) { return `${dayName(e)} ${dayNum(e)} ${monthName(e)}`; }
function shortDate(e) { return `${dayShort(e)} ${dayNum(e)} ${monthShort(e)}`; }
function t12(t) {
  let [h, m] = t.split(":").map(Number);
  const ap = h >= 12 ? "pm" : "am"; h = h % 12 || 12;
  return m ? `${h}:${String(m).padStart(2, "0")}${ap}` : `${h}${ap}`;
}
function timeRange(e) { return e.end ? `${t12(e.start)} to ${t12(e.end)}` : t12(e.start); }
function daysAway(e) { return Math.round((dateOf(e) - TODAY) / 86400000); }
function relDay(e) {
  const n = daysAway(e);
  if (n === 0) return "Today"; if (n === 1) return "Tomorrow";
  if (n < 7) return `This ${dayName(e)}`;
  return n < 14 ? `In ${n} days` : `In ${Math.round(n / 7)} weeks`;
}
function byId(id) { return EVENTS.find(e => e.id === id); }
function upcoming() { return EVENTS.filter(e => daysAway(e) >= 0).sort((a, b) => dateOf(a) - dateOf(b)); }
function room(e) { return ROOMS[e.room]; }
function words(n) { return n <= 10 ? NUM_WORDS[n] : String(n); }

/* Entry status: the one fact every screen must answer. */
function status(e) {
  if (e.entry === "dropin") return { key: "dropin", price: "Free", how: "Just turn up", short: "Free · just turn up" };
  const price = e.entry === "ticket" ? `£${e.price}` : "Free";
  const how = e.entry === "ticket" ? "Ticket needed" : "Book a seat";
  if (e.left === 0) return { key: "soldout", price, how: "Sold out", short: `${price} · sold out` };
  if (e.left <= Math.max(5, Math.round(e.cap * 0.15))) return { key: "few", price, how: `${e.left} seats left`, short: `${price} · only ${e.left} left` };
  return { key: "open", price, how, short: `${price} · ${e.entry === "ticket" ? "book a ticket" : "book a seat"}` };
}
function priceLine(e) {
  if (e.entry === "dropin") return "Free. No need to book.";
  if (e.entry === "freebook") return `Free, but seats are limited to ${e.cap}, so please book.`;
  let s = `£${e.price} a ticket`;
  if (e.redeem) s += `. The £${e.price} comes off the book if you buy a copy on the night.`;
  else if (e.extra) s += `, ${e.extra}.`;
  return s;
}
function actionLabel(e) {
  const s = status(e);
  if (s.key === "soldout") return "Join the waiting list";
  if (e.entry === "ticket") return `Book a ticket · £${e.price}`;
  if (e.entry === "freebook") return "Book a free seat";
  return "Add to my calendar";
}

/* Add to calendar: a real .ics download. */
function downloadIcs(e) {
  const d = e.date.replace(/-/g, "");
  const f = t => t.replace(":", "") + "00";
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//The Paper Moth//Events//EN", "BEGIN:VEVENT",
    `UID:${e.id}@paper-moth-prototype`, `DTSTART:${d}T${f(e.start)}`, `DTEND:${d}T${f(e.end || e.start)}`,
    `SUMMARY:${e.title} (The Paper Moth)`, `LOCATION:${SHOP.name}\\, ${SHOP.street}\\, ${SHOP.town}`,
    `DESCRIPTION:${priceLine(e)}`, "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
  a.download = `${e.id}.ics`; a.click();
}

function toast(msg) {
  let t = document.getElementById("proto-toast");
  if (!t) { t = document.createElement("div"); t.id = "proto-toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 3200);
}
function act(id) {
  const e = byId(id), s = status(e);
  if (e.entry === "dropin") { downloadIcs(e); return; }
  if (s.key === "soldout") { toast("Prototype: the waiting-list step is not designed yet."); return; }
  toast("Prototype: the booking step is not designed yet.");
}
function share(id) {
  const e = byId(id);
  const data = { title: e.title, text: `${e.title}, ${shortDate(e)} at The Paper Moth`, url: location.href };
  if (navigator.share) navigator.share(data).catch(() => {});
  else { navigator.clipboard && navigator.clipboard.writeText(location.href); toast("Link copied."); }
}

/* Router: #event=<id> shows one event, anything else shows the home page. */
function go(hash) { location.hash = hash; }
function route() {
  const m = location.hash.match(/event=([\w-]+)/);
  const e = m && byId(m[1]);
  const app = document.getElementById("app");
  app.innerHTML = e ? renderEvent(e) : renderHome();
  document.title = e ? `${e.title} · ${SHOP.name}` : `What's on · ${SHOP.name}`;
  window.scrollTo(0, 0);
  if (typeof afterRender === "function") afterRender(e);
  protoSync(e);
}

/* Prototype controls: outside the design, used to switch screens and entry states. */
function protoBar() {
  const opts = [["imogen-hale", "Ticketed, 4 seats left"], ["ghosts-of-tanners-lane", "Ticketed, seats free"], ["dev-okafor", "Free, sold out"], ["book-club-piranesi", "Free, book a seat"], ["story-3-oct", "Free, just turn up"]];
  const bar = document.createElement("div");
  bar.className = "proto";
  bar.innerHTML = `<span class="proto-tag">Prototype controls, not part of the design</span>
    <a href="#home" data-p="home">Home page</a>
    <label>Event page: <select id="proto-sel">${opts.map(([id, l]) => `<option value="${id}">${l}</option>`).join("")}</select></label>`;
  document.body.prepend(bar);
  bar.querySelector("select").addEventListener("change", ev => go(`event=${ev.target.value}`));
  bar.querySelector("select").addEventListener("click", ev => { if (!location.hash.includes("event=")) go(`event=${ev.target.value}`); });
}
function protoSync(e) {
  document.querySelector('.proto [data-p="home"]').classList.toggle("on", !e);
  const sel = document.getElementById("proto-sel");
  sel.classList.toggle("on", !!e);
  if (e && [...sel.options].some(o => o.value === e.id)) sel.value = e.id;
}
const PROTO_CSS = `
.proto{position:relative;z-index:50;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:8px 16px;background:#1d1d1f;color:#d8d8d8;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.proto-tag{color:#9a9a9a;flex-basis:100%}
@media (min-width:700px){.proto-tag{flex-basis:auto}}
.proto a{color:#d8d8d8}.proto a.on{color:#fff;font-weight:700;text-decoration:none}
.proto select{font:inherit;background:#333;color:#eee;border:1px solid #555;border-radius:3px;padding:2px 4px;max-width:210px}
.proto select.on{border-color:#aaa;color:#fff}
#proto-toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#1d1d1f;color:#fff;font:14px/1.4 ui-monospace,Menlo,monospace;padding:10px 14px;border-radius:6px;transition:.2s;z-index:99;max-width:calc(100vw - 32px)}
#proto-toast.on{opacity:1;transform:translate(-50%,0)}`;
document.head.insertAdjacentHTML("beforeend", `<style>${PROTO_CSS}</style>`);
window.addEventListener("hashchange", route);
window.addEventListener("DOMContentLoaded", () => { protoBar(); route(); });

</script>
<script>
/* Ornaments: one per event type, drawn once, reused on every poster. */
const ORN = {
  author: `<svg class="orn" viewBox="0 0 100 100" aria-hidden="true" fill="currentColor"><path d="M8 58c0-22 12-38 32-44l3 8C31 27 26 36 26 46h14v38H8zM56 58c0-22 12-38 32-44l3 8C79 27 74 36 74 46h14v38H56z"/></svg>`,
  club: `<svg class="orn" viewBox="0 0 100 100" aria-hidden="true" fill="currentColor"><path d="M14 40h58v14c0 18-13 30-29 30S14 72 14 54zM72 46h6a10 10 0 010 20h-7l2-7h5a3 3 0 000-6h-6zM6 88h74v5H6z"/><path d="M32 14c-6 7 6 10 0 18M45 10c-6 7 6 12 0 22M58 14c-6 7 6 10 0 18" stroke="currentColor" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg>`,
  story: `<svg class="orn" viewBox="0 0 100 100" aria-hidden="true" fill="currentColor"><path d="M62 10a40 40 0 1 0 28 62A34 34 0 0 1 62 10z"/><path d="M22 14l3 8 8 3-8 3-3 8-3-8-8-3 8-3zM40 80l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/></svg>`
};
const KIND = { author: "Author reading", club: "Book club", story: "Story hour" };
function splitTitle(e) {
  if (e.type === "author" && e.title.includes(":")) { const [a, b] = e.title.split(": "); return [a, b]; }
  if (e.type === "club") return [e.subject.split(" by ")[0], `by ${e.subject.split(" by ")[1]}`];
  return [e.title, e.note || ""];
}
function sticker(e) {
  const s = status(e);
  if (s.key === "soldout") return `<span class="stamp">Sold out</span>`;
  if (s.key === "few") return `<span class="sticker few">Only ${e.left} left</span>`;
  return "";
}
function footLeft(e) {
  const s = status(e);
  if (s.key === "soldout") return "&nbsp;";
  if (e.entry === "dropin") return "Free · no booking";
  if (e.entry === "freebook") return "Free · book a seat";
  return e.redeem ? `£${e.price} · off the book` : `£${e.price}`;
}
function poster(e, { tag = "a", big = false } = {}) {
  const s = status(e); const [t1, t2] = splitTitle(e);
  const attrs = tag === "a" ? `href="#event=${e.id}" aria-label="${e.title}, ${longDate(e)}, ${t12(e.start)}. ${s.short}."` : "";
  const T = big ? "h1" : "p";
  return `<${tag} class="poster is-${s.key}" data-type="${e.type}" ${attrs}>
    ${ORN[e.type]}
    <p class="p-kind">${KIND[e.type]}</p>
    <p class="p-day">${dayName(e)}</p>
    <p class="p-num">${dayNum(e)}<small>${monthShort(e)}</small></p>
    <${T} class="p-title">${t1}</${T}>
    ${t2 ? `<p class="p-sub">${t2}</p>` : ""}
    <p class="p-time">${t12(e.start)}${e.type === "story" ? " · ages 2–6" : ""}</p>
    <p class="p-foot"><span>${footLeft(e)}</span></p>
    ${sticker(e)}
  </${tag}>`;
}
function header(active) {
  return `<header class="top"><div class="wrap">
    <a class="brand" href="#home">The Paper Moth<span>Booksellers · Tanner's Lane</span></a>
    <nav class="nav" aria-label="Main"><a href="#home" ${active ? 'aria-current="page"' : ""}>What's on</a><a href="#visit">Visit</a></nav>
  </div></header>`;
}
function renderHome() {
  return `${header(true)}<main class="wrap">
    <div class="intro"><h1>What's on</h1>
      <p>Everything happening at the shop, pinned up in one place. Red for authors, green for book club, yellow for Saturday story hour. Tap a poster for details.</p></div>
    <ul class="window">${upcoming().map(e => `<li>${poster(e)}</li>`).join("")}</ul>
    <section class="handbill" id="visit"><h2>Find the shop</h2>
      <dl><dt>Where</dt><dd>${SHOP.street}, ${SHOP.town}</dd>${SHOP.hours.map(([d, h]) => `<dt>${d.replace("Monday to Saturday", "Mon–Sat")}</dt><dd>${h}</dd>`).join("")}<dt>Ring</dt><dd><a href="tel:${SHOP.phone.replace(/\s/g, "")}">${SHOP.phone}</a></dd></dl>
      <ul class="key">
        <li><span class="chip drop">No booking</span><span>Free. Just turn up. All story hours.</span></li>
        <li><span class="chip few">Only 4 left</span><span>Nearly full. Book soon.</span></li>
        <li><span class="chip sold">Sold out</span><span>Join the waiting list on the event page.</span></li>
      </ul>
    </section>
  </main>
  <footer class="foot"><div class="wrap">The Paper Moth, independent booksellers since 2011. Run by ${SHOP.owners}.</div></footer>`;
}
function answer(e) {
  const s = status(e);
  if (s.key === "dropin") return `<p class="answer">Free. No need to book, just turn up.</p><p>Come a few minutes before ${t12(e.start)}. There is always room on the rug.</p>
    <button class="btn ghost" onclick="act('${e.id}')">Add to my calendar</button>`;
  if (s.key === "soldout") return `<p class="answer">Sold out. All ${e.cap} seats have gone.</p><p>Leave your email and we will write to you, in order, if a seat comes back. People often cancel on the day.</p>
    <form class="wait" onsubmit="event.preventDefault();act('${e.id}')"><label for="wl">Your email</label><input id="wl" type="email" autocomplete="email" required placeholder="name@example.com"><button class="btn">Join the waiting list</button></form>`;
  return `<p class="answer">${s.key === "few" ? `Only ${e.left} seats left.` : `${e.left} of ${e.cap} seats left.`} ${e.entry === "ticket" ? `£${e.price} a ticket.` : "Free, but please book."}</p>
    <p>${e.redeem ? `The £${e.price} comes off the book if you buy a copy on the night.` : e.extra ? `Price ${e.extra}.` : "Seats are limited, so we keep a list."}</p>
    <button class="btn" onclick="act('${e.id}')">${actionLabel(e)}</button>
    <p class="fine">No printed ticket: your name goes on the list at the door.${e.entry === "ticket" ? " Refunds if you tell us by noon on the day." : ""}</p>`;
}
function renderEvent(e) {
  const r = room(e);
  const more = upcoming().filter(x => x.id !== e.id);
  return `${header(false)}<main class="wrap">
    <a class="back" href="#home">← Back to the window</a>
    <div class="ev-layout">
      <div class="hero">${poster(e, { tag: "div", big: true })}</div>
      <div>
        <div class="card">
          ${answer(e)}
          <dl class="facts">
            <div><dt>When</dt><dd>${longDate(e)}<span>${timeRange(e)}${e.doors ? `, doors ${t12(e.doors)}` : ""}</span></dd></div>
            <div><dt>Where</dt><dd>${r.name}<span>${SHOP.name}, ${SHOP.street}</span></dd></div>
            <div><dt>For</dt><dd>${e.age}</dd></div>
          </dl>
          <div class="minor">${status(e).key === "dropin" ? "" : `<button onclick="downloadIcs(byId('${e.id}'))">Add to calendar</button>`}<button onclick="share('${e.id}')">Share</button></div>
        </div>
        <section class="prose"><h2>What happens</h2>${e.blurb.map(p => `<p>${p}</p>`).join("")}
          <dl><dt>Getting in</dt><dd>${r.access}</dd><dt>Questions</dt><dd>Ring us on <a href="tel:${SHOP.phone.replace(/\s/g, "")}">${SHOP.phone}</a>.</dd></dl>
        </section>
      </div>
    </div>
    <section class="more"><h2>Also in the window</h2><ul class="strip">${more.map(x => `<li>${poster(x)}</li>`).join("")}</ul></section>
  </main>
  <footer class="foot"><div class="wrap">The Paper Moth, ${SHOP.street}, ${SHOP.town}.</div></footer>`;
}
function afterRender(e) { if (!e && location.hash === "#visit") document.getElementById("visit").scrollIntoView(); }
</script>
</body>
