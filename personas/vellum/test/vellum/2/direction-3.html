<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Front desk — Gap board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ground: oklch(0.965 0.005 255);
  --panel: #fff;
  --ink: oklch(0.23 0.03 258);
  --ink-2: oklch(0.42 0.025 258);
  --muted: oklch(0.56 0.018 258);
  --line: oklch(0.89 0.01 258);
  --line-2: oklch(0.8 0.015 258);
  --block: oklch(0.93 0.012 258);
  --block-edge: oklch(0.82 0.02 258);
  --gap: oklch(0.83 0.16 78);          /* the one loud colour: unused time */
  --gap-ink: oklch(0.35 0.08 60);
  --gap-soft: oklch(0.96 0.05 85);
  --res: oklch(0.52 0.13 300);         /* rooms and machines */
  --res-soft: oklch(0.93 0.035 300);
  --late: oklch(0.55 0.2 27);
  --ok: oklch(0.56 0.14 150);
  --pay: oklch(0.66 0.14 65);
  --lab: 196px;
  font-size: 13px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: "IBM Plex Sans Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif; font-variant-numeric: tabular-nums; color: var(--ink); background: var(--ground);
  display: grid; grid-template-rows: auto auto 1fr; overflow: hidden; }
button, input { font: inherit; color: inherit; }
kbd { font: 500 11px/1 inherit; font-family: inherit; padding: 2px 5px; border-radius: 3px; border: 1px solid currentColor; opacity: .75; }
h2, h3 { margin: 0; }

/* header */
.bar { display: flex; align-items: center; gap: 20px; padding: 0 18px; height: 50px; background: var(--ink); color: oklch(0.96 0.01 258); }
.bar .name { font-weight: 700; font-size: 15px; }
.bar .date { color: oklch(0.8 0.02 258); }
.bar .stat { display: flex; gap: 16px; margin-left: 12px; }
.bar .stat span { color: oklch(0.78 0.02 258); }
.bar .stat b { color: #fff; font-weight: 600; }
.bar .stat .gs b { color: var(--gap); }
.bar .find { margin-left: auto; display: flex; gap: 8px; }
.bar input { background: oklch(0.32 0.03 258); border: 1px solid oklch(0.42 0.03 258); color: #fff; border-radius: 4px; padding: 6px 10px; width: 240px; }
.bar input::placeholder { color: oklch(0.72 0.02 258); }
.btn { border: 1px solid var(--line-2); background: var(--panel); border-radius: 4px; padding: 5px 10px; cursor: pointer; white-space: nowrap; font-weight: 500; }
.btn:hover { border-color: var(--ink-2); }
.btn.go { background: var(--gap); border-color: var(--gap); color: var(--gap-ink); font-weight: 700; }
.btn.dark { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn.sm { padding: 2px 8px; font-size: 12px; }
.bar .btn.go kbd { border-color: var(--gap-ink); }

/* timeline */
.board { background: var(--panel); border-bottom: 1px solid var(--line-2); padding: 0 18px 8px 0; position: relative; }
.axis, .lane { display: grid; grid-template-columns: var(--lab) 1fr; }
.axis { height: 26px; }
.ticks { position: relative; }
.ticks span { position: absolute; bottom: 4px; transform: translateX(-50%); font-size: 11.5px; color: var(--muted); }
.ticks span.h { color: var(--ink-2); font-weight: 600; }
.lab { padding: 6px 12px 6px 18px; border-top: 1px solid var(--line); display: flex; flex-direction: column; justify-content: center; }
.lab b { font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.lab small { color: var(--muted); font-size: 12px; white-space: nowrap; }
.track { position: relative; border-top: 1px solid var(--line); height: 64px;
  background: repeating-linear-gradient(to right, var(--line) 0 1px, transparent 1px var(--hour)); }
.lane.res .track { height: 28px; }
.lane.res .lab { padding-top: 2px; padding-bottom: 2px; flex-direction: row; align-items: center; justify-content: flex-start; gap: 6px; }
.lane.res .lab b { font-size: 12.5px; color: var(--res); }
.lane.res .lab small { font-size: 11.5px; }
.lane.sep .lab, .lane.sep .track { border-top: 2px solid var(--line-2); }
.off { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, oklch(0.94 0.006 258) 0 5px, oklch(0.97 0.004 258) 5px 10px); }
.pastfog { position: absolute; top: 0; bottom: 0; left: 0; background: oklch(1 0 0 / .55); pointer-events: none; z-index: 3; }
.nowl { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--late); z-index: 3; pointer-events: none; }
.nowl span { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); background: var(--late); color: #fff; font-size: 11px; font-weight: 700; padding: 1px 5px; border-radius: 3px; }
.b { position: absolute; top: 4px; bottom: 4px; border-radius: 3px; background: var(--block); border: 1px solid var(--block-edge); padding: 2px 4px; overflow: hidden; cursor: pointer; z-index: 2; line-height: 1.22; }
.b:hover, .b.sel { outline: 2px solid var(--ink); outline-offset: -1px; z-index: 4; }
.b .n { font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: clip; }
.b .c { color: var(--ink-2); font-size: 11.5px; white-space: nowrap; overflow: hidden; }
.b .s { font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; }
.b.done { background: oklch(0.975 0.004 258); border-color: var(--line); color: var(--muted); }
.b.done .c { color: var(--muted); }
.b.in { background: var(--ink-2); border-color: var(--ink-2); color: #fff; }
.b.in .c { color: oklch(0.88 0.02 258); }
.b.late { background: oklch(0.95 0.035 27); border: 1.5px solid var(--late); }
.b.late .s { color: var(--late); }
.b.arrived { box-shadow: inset 0 -4px 0 var(--ok); }
.b.arrived .s { color: oklch(0.45 0.12 150); }
.b.topay { box-shadow: inset 0 -4px 0 var(--pay); }
.b.topay .s { color: oklch(0.5 0.12 60); }
.b.late, .b.in { z-index: 4; }
.b.dna { background: transparent; border: 1.5px dashed var(--late); color: var(--late); }
.b.fresh { outline: 2px solid var(--gap-ink); }
.b .rs { color: var(--res); font-weight: 700; }
.g { position: absolute; top: 4px; bottom: 4px; border-radius: 3px; background: var(--gap); color: var(--gap-ink); z-index: 2; padding: 3px 5px; cursor: pointer; line-height: 1.2; overflow: hidden; }
.g b { font-size: 13px; }
.g small { display: block; font-size: 11px; font-weight: 600; white-space: nowrap; }
.g:hover, .g.sel { outline: 2.5px solid var(--ink); outline-offset: 0; z-index: 4; }
.r { position: absolute; top: 4px; bottom: 4px; border-radius: 3px; background: var(--res-soft); border: 1px solid oklch(0.8 0.07 300); color: var(--res); font-size: 10.5px; font-weight: 600; padding: 2px 2px; overflow: hidden; white-space: nowrap; }
.r.probe { background: transparent; border: 1.5px dashed var(--res); }

/* lower area */
.lower { display: grid; grid-template-columns: 380px 1fr; min-height: 0; }
.detail { background: var(--panel); border-right: 1px solid var(--line-2); padding: 14px 18px; overflow: auto; }
.detail h2 { font-size: 17px; font-weight: 600; }
.detail .sub { color: var(--ink-2); margin: 2px 0 12px; }
.detail dl { display: grid; grid-template-columns: 78px 1fr; gap: 4px 10px; margin: 0 0 12px; }
.detail dt { color: var(--muted); }
.detail dd { margin: 0; }
.detail .acts { display: flex; flex-wrap: wrap; gap: 6px; }
.match { border: 1px solid var(--line-2); border-radius: 5px; padding: 8px 10px; margin-bottom: 6px; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
.match.best { border-color: var(--gap); background: var(--gap-soft); }
.match small { color: var(--ink-2); grid-column: 1; }
.match .acts { grid-column: 2; grid-row: 1 / 3; }
.queue { overflow: auto; padding: 12px 18px 18px; }
.queue h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); font-weight: 600; margin: 4px 0 8px; display: flex; gap: 10px; align-items: baseline; }
.queue h3 span { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--muted); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 8px; margin-bottom: 14px; }
.card { background: var(--panel); border: 1px solid var(--line-2); border-radius: 5px; padding: 8px 10px; cursor: pointer; border-left: 5px solid var(--gap); }
.card:hover, .card.sel { border-color: var(--ink); border-left-color: var(--gap); }
.card.lateC { border-left-color: var(--late); }
.card .t { font-weight: 700; font-size: 14px; }
.card .w { color: var(--ink-2); }
.card .m { color: var(--muted); font-size: 12px; margin-top: 3px; }
.card .m b { color: var(--gap-ink); }

/* finder overlay */
.finder { position: fixed; inset: 50px 0 0 0; background: var(--ground); z-index: 20; display: none; grid-template-columns: 360px 1fr; grid-template-rows: 1fr auto; }
body.finding .finder { display: grid; }
.req { background: var(--panel); border-right: 1px solid var(--line-2); padding: 16px 18px; overflow: auto; grid-row: 1; }
.req h2 { font-size: 17px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; }
.q { margin-top: 14px; }
.q > .l { font-weight: 600; margin-bottom: 5px; display: block; }
.q input { width: 100%; padding: 7px 9px; border: 1px solid var(--line-2); border-radius: 4px; }
.q input:focus { outline: 2px solid var(--ink); }
.pick { display: flex; flex-wrap: wrap; gap: 5px; }
.pick button { border: 1px solid var(--line-2); background: var(--panel); border-radius: 4px; padding: 4px 9px; cursor: pointer; }
.pick button[aria-pressed=true] { background: var(--ink); border-color: var(--ink); color: #fff; }
.pick button[disabled] { opacity: .4; cursor: not-allowed; }
.trs { display: grid; gap: 4px; }
.trs button { display: grid; grid-template-columns: 1fr auto; text-align: left; border: 1px solid var(--line-2); background: var(--panel); border-radius: 4px; padding: 5px 9px; cursor: pointer; }
.trs button small { color: var(--muted); }
.trs button .rs { color: var(--res); font-size: 11.5px; font-weight: 600; grid-column: 1 / -1; }
.trs button[aria-pressed=true] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); background: oklch(0.97 0.006 258); }
.pres div { padding: 6px 9px; cursor: pointer; display: flex; gap: 10px; border: 1px solid var(--line-2); border-top: 0; }
.pres div.on, .pres div:hover { background: var(--gap-soft); }
.pres small { margin-left: auto; color: var(--muted); }
.chosen { display: flex; gap: 10px; align-items: center; padding: 7px 10px; background: oklch(0.97 0.006 258); border: 1px solid var(--line-2); border-radius: 4px; }
.chosen small { display: block; color: var(--muted); }
.chosen .btn { margin-left: auto; }
.out { padding: 16px 22px; overflow: auto; grid-row: 1; }
.out h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); margin: 0 0 8px; font-weight: 600; }
.best3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 18px; }
.opt { background: var(--panel); border: 1px solid var(--line-2); border-radius: 6px; padding: 10px 12px; cursor: pointer; text-align: left; }
.opt .d { color: var(--ink-2); }
.opt .tm { font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
.opt .why { color: var(--muted); font-size: 12px; margin-top: 4px; }
.opt[aria-pressed=true] { border: 2px solid var(--ink); padding: 9px 11px; }
.mx { border-collapse: separate; border-spacing: 0; width: 100%; background: var(--panel); border: 1px solid var(--line-2); border-radius: 6px; overflow: hidden; }
.mx th, .mx td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.mx th { font-weight: 600; color: var(--ink-2); background: oklch(0.975 0.004 258); }
.mx td.who { font-weight: 600; white-space: nowrap; }
.mx td.who small { display: block; font-weight: 400; color: var(--muted); }
.mx .slot { display: inline-block; margin: 0 4px 4px 0; border: 1px solid var(--line-2); border-radius: 3px; padding: 1px 6px; cursor: pointer; background: var(--panel); }
.mx .slot:hover { border-color: var(--ink); }
.mx .slot[aria-pressed=true] { background: var(--ink); color: #fff; border-color: var(--ink); }
.mx .none { color: var(--muted); }
.confirm { grid-column: 1 / -1; background: var(--ink); color: #fff; display: flex; align-items: center; gap: 18px; padding: 12px 22px; }
.confirm .say small { display: block; color: oklch(0.78 0.02 258); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; }
.confirm .say { font-size: 14px; }
.confirm label { margin-left: auto; display: flex; gap: 6px; align-items: center; color: oklch(0.85 0.02 258); }
.found { position: absolute; right: 0; top: 36px; width: 380px; background: var(--panel); color: var(--ink); border: 1px solid var(--line-2); border-radius: 6px; box-shadow: 0 8px 28px oklch(0.2 0.02 258 / .25); z-index: 30; display: none; }
.found.open { display: block; }
.found div { padding: 7px 10px; border-top: 1px solid var(--line); cursor: pointer; display: grid; grid-template-columns: 1fr auto; }
.found div:first-child { border-top: 0; }
.found div:hover { background: var(--gap-soft); }
.found small { color: var(--muted); }
.toast button { background: none; border: 0; color: var(--gap); font-weight: 700; cursor: pointer; margin-left: 10px; }
.toast { position: fixed; right: 18px; bottom: 18px; background: var(--ink); color: #fff; padding: 9px 14px; border-radius: 5px; z-index: 40; display: none; }
.toast.show { display: block; }
</style>
</head>
<body>
<header class="bar">
  <span class="name">Hollis Street Physio</span><span class="date">Tuesday 29 September</span>
  <span class="stat" id="stat"></span>
  <span class="find"><span style="position:relative"><input id="q" autocomplete="off" placeholder="Patient name or phone"><div class="found" id="found"></div></span><button class="btn go" id="findBtn">Find a time <kbd>F</kbd></button></span>

    <table class="mx"><thead><tr><th style="width:150px"></th>${days.map(d => `<th>${DAYS[d].short}</th>`).join('')}</tr></thead><tbody>
    ${ths.map(t => `<tr><td class="who">${t.first}<small>${fmt(t.start)}–${fmt(t.end)}</small></td>${days.map(d => {
      const ss = all.filter(s => s.t === t.id && s.d === d).slice(0, 8);
      return `<td>${ss.length ? ss.map(s => `<span class="slot" data-slot="${s.d}|${s.t}|${s.s}" aria-pressed="${F.pick && F.pick.d === s.d && F.pick.s === s.s && F.pick.t === s.t}">${fmt(s.s)}</span>`).join('') : '<span class="none">—</span>'}</td>`;
    }).join('')}</tr>`).join('')}</tbody></table>`;
  $('#confirm').innerHTML = `<div class="say"><small>Read back to the caller</small>${F.pick && P ? esc(readBack(F.pick, F.tr)) : F.pick ? 'Choose the patient first.' : 'No time chosen.'}</div>
    <label><input type="checkbox" ${F.text ? 'checked' : ''} data-text> Text confirmation</label>
    <button class="btn go" data-book ${F.pick && P ? '' : 'disabled style="opacity:.5"'}>${F.moving ? 'Move it' : 'Book it'} <kbd>⏎</kbd></button>`;
  if (focus && !P) setTimeout(() => $('#fq') && $('#fq').focus(), 0);
}
function bookFinder() {
  if (!F || !F.pick || !F.patient) return;
  snap();
  let a;
  if (F.moving) { const old = APPTS.find(x => x.id === F.moving); old.status = 'cancelled'; old.note = `Moved to ${DAYS[F.pick.d].short} ${fmt(F.pick.s)}`; }
  a = commitBooking(F.pick, F.tr, F.patient); if (F.moving) a.note = 'Moved from ' + fmt(APPTS.find(x => x.id === F.moving).start);
  const w = WAITLIST.findIndex(w => w.patient === F.patient.name); if (w >= 0 && F.pick.d === 0) WAITLIST.splice(w, 1);
  toast(`${F.moving ? 'Moved' : 'Booked'} ${F.patient.name} · ${DAYS[F.pick.d].short} ${fmt(F.pick.s)} with ${TH[F.pick.t].first}${F.text ? ' · text sent' : ''}`);
  if (F.pick.d === 0) SEL = 'a' + a.id;
  closeFinder(); renderAll();
}
function toast(m, canUndo = true) { const t = $('#toast'); t.innerHTML = esc(m) + (canUndo ? '<button id="undo">Undo</button>' : ''); t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 5000); }

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target;
  if (F) {
    if (el.closest('[data-close]')) return closeFinder();
    const p = el.closest('[data-p]'); if (p) { F.patient = searchPatients(F.q)[+p.dataset.p]; if (F.patient.usual && F.t === 'any' && !F.gap) F.t = 'any'; return renderFinder(); }
    if (el.closest('[data-unpick]')) { F.patient = null; return renderFinder(true); }
    const tr = el.closest('[data-tr]'); if (tr && !tr.disabled) { F.tr = tr.dataset.tr; return renderFinder(); }
    const th = el.closest('[data-th]'); if (th && !th.disabled) { F.t = th.dataset.th; return renderFinder(); }
    const d = el.closest('[data-day]'); if (d) { const i = +d.dataset.day; F.days = F.days.includes(i) ? F.days.filter(x => x !== i) : [...F.days, i].sort(); if (!F.days.length) F.days = [i]; return renderFinder(); }
    const w = el.closest('[data-win]'); if (w) { F.win = w.dataset.win; return renderFinder(); }
    const s = el.closest('[data-slot]'); if (s) { const [dd, tt, ss] = s.dataset.slot.split('|'); F.pick = finderSlots(true).find(x => x.d === +dd && x.t === tt && x.s === +ss); return renderFinder(); }
    if (el.closest('[data-text]')) { F.text = el.checked; return; }
    if (el.closest('[data-book]')) return bookFinder();
    return;
  }
  if (el.id === 'undo') { if (undo()) { SEL = null; renderAll(); toast('Undone', false); } return; }
  const of = el.closest('[data-offer]'); if (of) { const { g } = sel(); const n = of.dataset.offer === 'all' ? waitlistFor(g).length + ' people' : of.dataset.offer; return toast(`Offer for ${fmt(g.s)} with ${TH[g.t].first} texted to ${n}`, false); }
  const fd = el.closest('[data-found]');
  if (fd) { $('#found').classList.remove('open'); const [kind, v] = fd.dataset.found.split(':'); $('#q').value = '';
    if (kind === 'a') { SEL = 'a' + v; return renderAll(); }
    return openFinder({ patient: PATIENTS.find(p => p.id === v) }); }
  if (!el.closest('.find')) $('#found').classList.remove('open');
  if (el.id === 'findBtn') return openFinder({ q: $('#q').value });
  const k = el.closest('[data-k]'); if (k) { SEL = k.dataset.k; return renderAll(); }
  const fill = el.closest('[data-fill]');
  if (fill) { const { g } = sel(); const w = WAITLIST.find(w => w.patient === fill.dataset.fill); const p = PATIENTS.find(p => p.name === w.patient);
    const slot = { d: 0, t: g.t, s: g.s, e: g.s + TRT[w.tr].dur, room: TRT[w.tr].needs === 'Studio' ? 'Studio' : TH[g.t].room, machine: TRT[w.tr].needs === 'Shockwave unit' ? TRT[w.tr].needs : null };
    snap(); const a = commitBooking(slot, w.tr, p); WAITLIST.splice(WAITLIST.indexOf(w), 1); SEL = 'a' + a.id; toast(`Booked ${p.name} into ${fmt(g.s)} with ${TH[g.t].first} · text sent`); return renderAll(); }
  if (el.closest('[data-findgap]')) { const { g } = sel(); const f = fitsGap(g); return openFinder({ gap: g, tr: f.some(t => t.id === 'FU') ? 'FU' : f[0].id }); }
  const d = el.closest('[data-do]');
  if (d) { const { a } = sel(); const v = d.dataset.do; if (v !== 'move' && v !== 'pay') snap();
    if (v === 'in') a.status = a.start + a.dur <= NOW ? 'done' : 'arrived';
    if (v === 'pay') { a.paid = true; if (a.status !== 'in') a.status = 'done'; toast(`Paid ${money(TRT[a.tr].price)} by card · ${a.patient} · receipt texted`, false); }
    if (v === 'short') { applyShorten(a); toast(`${a.patient}: ${a.note}`); }
    if (v === 'dna') a.status = 'dna';
    if (v === 'cancel') { a.status = 'cancelled'; a.note = 'Cancelled at the desk ' + fmt(NOW); SEL = null; toast(`Cancelled ${a.patient} ${fmt(a.start)} — ${a.dur} min now free`); }
    if (v === 'move') { const p = PATIENTS.find(p => p.name === a.patient); return openFinder({ patient: p, tr: a.tr, moving: a.id }); }
    renderAll(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') {
    const q = e.target.value, f = $('#found'); if (q.trim().length < 2) { f.classList.remove('open'); return; }
    const ps = searchPatients(q);
    f.innerHTML = ps.length ? ps.map(p => { const a = APPTS.find(x => x.patient === p.name && occupies(x));
      return a ? `<div data-found="a:${a.id}"><b>${esc(p.name)}</b><small>today ${fmt(a.start)} · ${TH[a.t].first} · ${statusLabel(a) || 'booked'}</small></div>`
        : `<div data-found="p:${p.id}"><b>${esc(p.name)}</b><small>nothing today — find a time</small></div>`; }).join('') : `<div><small>No patient matches.</small></div>`;
    f.classList.add('open'); return;
  }
  if (F && e.target.id === 'fq') { F.q = e.target.value; F.pi = 0; renderFinder(); const i = $('#fq'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); } });
document.addEventListener('keydown', e => {
  if (F) {
    if (e.key === 'Escape') return closeFinder();
    if (document.activeElement.id === 'fq') {
      const r = searchPatients(F.q);
      if (e.key === 'ArrowDown') { F.pi = Math.min(r.length - 1, F.pi + 1); renderFinder(); $('#fq').focus(); e.preventDefault(); }
      if (e.key === 'ArrowUp') { F.pi = Math.max(0, F.pi - 1); renderFinder(); $('#fq').focus(); e.preventDefault(); }
      if (e.key === 'Enter' && r[F.pi]) { F.patient = r[F.pi]; renderFinder(); e.preventDefault(); }
      return;
    }
    if (e.key === 'Enter') { e.preventDefault(); bookFinder(); }
    return;
  }
  if (/INPUT/.test(document.activeElement.tagName)) { if (e.key === 'Enter' && document.activeElement.id === 'q') openFinder({ q: $('#q').value }); return; }
  if (e.key === 'f' || e.key === 'F') { e.preventDefault(); openFinder(); }
  if (e.key === 'g' || e.key === 'G') { const G = allGaps(); const i = G.findIndex(g => SEL === 'g' + g.t + g.s); const g = G[(i + 1) % G.length]; SEL = 'g' + g.t + g.s; renderAll(); }
});
addEventListener('resize', renderBoard);

SEL = (() => { const g = allGaps().find(g => waitlistFor(g).length); return 'g' + g.t + g.s; })();
renderAll();
/* prototype entry points: #book opens Find a time for a caller, #late selects a late patient */
if (location.hash === '#book') { openFinder({ q: 'anna kow' }); F.patient = searchPatients('anna kow')[0]; F.tr = 'SW'; renderFinder(); }
if (location.hash === '#late') { SEL = 'a' + APPTS.find(a => a.status === 'late').id; renderAll(); }
</script>
