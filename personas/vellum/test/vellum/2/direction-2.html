<title>Front desk — Run sheet</title>

<style>
/* One family, two cuts, ONE size. Hierarchy comes only from weight, ink and position. */
:root {
  --paper: #f6f4ee;
  --sheet: #fffefb;
  --ink: #1c1a16;
  --muted: #6d685c;
  --rule: #e2ddd0;
  --rule-strong: #c9c2b1;
  --mark: #fff09a;          /* highlighter: the selected line */
  --late: #b3261e;
  --ok: #1d6b3a;
  --in: #24508f;
  --pay: #8a5a00;
  --size: 14px;
  --row: 28px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 400 var(--size)/1.4 "Atkinson Hyperlegible Next", "Segoe UI", system-ui, sans-serif; color: var(--ink); background: var(--paper);
  display: grid; grid-template-rows: auto auto 1fr auto; overflow: hidden; }
.mono, .time, kbd, .num { font-family: "Atkinson Hyperlegible Mono", ui-monospace, "Cascadia Mono", Menlo, monospace; font-size: var(--size); }
b, strong { font-weight: 700; }
button, input { font: inherit; color: inherit; }
kbd { display: inline-block; min-width: 1.6em; text-align: center; padding: 0 4px; border: 1px solid var(--rule-strong); border-bottom-width: 2px; border-radius: 3px; background: var(--sheet); line-height: 1.35; }
.m { color: var(--muted); }

/* top line */
.top { display: flex; gap: 22px; align-items: baseline; padding: 8px 18px 6px; }
.top .where b { margin-right: 8px; }
.tally { display: flex; gap: 18px; margin-left: auto; }
.tally button { border: 0; background: none; padding: 0; cursor: pointer; }
.tally button:hover { text-decoration: underline; }
.tally .late { color: var(--late); font-weight: 700; }

/* command line */
.cmd { margin: 0 18px; display: flex; align-items: center; gap: 10px; background: var(--sheet); border: 1.5px solid var(--ink); border-radius: 4px; padding: 0 12px; height: 44px; }
.cmd:focus-within { box-shadow: 0 0 0 3px var(--mark); }
.cmd .prompt { font-weight: 700; }
.cmd input { flex: 1; border: 0; outline: 0; background: transparent; height: 100%; }
.cmd input::placeholder { color: var(--muted); }

/* body */
.body { display: grid; grid-template-columns: 1fr 440px; gap: 0; min-height: 0; margin-top: 10px; border-top: 1px solid var(--rule-strong); }
.sheet { overflow: auto; background: var(--sheet); border-right: 1px solid var(--rule-strong); }
.filters { position: sticky; top: 0; z-index: 3; background: var(--sheet); display: flex; gap: 16px; padding: 7px 14px; border-bottom: 1px solid var(--rule-strong); }
.filters button { border: 0; background: none; cursor: pointer; padding: 0; color: var(--muted); }
.filters button[aria-pressed=true] { color: var(--ink); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
th { position: sticky; top: 35px; z-index: 2; background: var(--sheet); text-align: left; font-weight: 400; color: var(--muted); padding: 4px 8px; border-bottom: 1px solid var(--rule); }
td { padding: 0 8px; height: var(--row); border-bottom: 1px solid var(--rule); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
tr.first td { border-top: 1px solid var(--rule-strong); }
tr.sel td { background: var(--mark); }
tr[data-k] { cursor: default; }
td.time { color: var(--muted); }
tr.first td.time { color: var(--ink); }
.st-late { color: var(--late); font-weight: 700; }
.st-arrived { color: var(--ok); font-weight: 700; }
.st-in { color: var(--in); }
.st-topay { color: var(--pay); font-weight: 700; }
.st-dna { color: var(--late); }
.st-booked, .st-done { color: var(--muted); }
tr.done td { color: var(--muted); }
tr.done td.pt { color: var(--ink); }
tr.gap td { background: repeating-linear-gradient(135deg, transparent 0 7px, #efe9d8 7px 8px); }
tr.gap.sel td { background: var(--mark); }
tr.gap .free { font-weight: 700; }
tr.nowline td { height: 24px; border-bottom: 2px solid var(--ink); font-weight: 700; background: var(--sheet); }
tr.fold td { color: var(--muted); }
tr.fold button { border: 0; background: none; padding: 0; text-decoration: underline; cursor: pointer; color: inherit; }
tr.fresh td.pt::after { content: "  new"; color: var(--ok); font-weight: 700; }

/* side pane */
.pane { overflow: auto; padding: 14px 18px 24px; }
.pane h2 { font: inherit; font-weight: 700; margin: 0 0 2px; }
.pane .sub { color: var(--muted); margin-bottom: 12px; }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 4px 12px; margin: 0 0 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
.act { display: flex; gap: 8px; align-items: center; text-align: left; border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: 4px; padding: 6px 8px; cursor: pointer; }
.act:hover { border-color: var(--ink); }
.act.primary { border: 1.5px solid var(--ink); font-weight: 700; }
.rule { border-top: 1px solid var(--rule-strong); margin: 16px 0 12px; }
.list .li { display: grid; grid-template-columns: 24px 1fr auto; gap: 8px; padding: 5px 6px; border-bottom: 1px solid var(--rule); align-items: baseline; }
.list .li.on { background: var(--mark); }
.list .li .m { grid-column: 2 / -1; }
.parse { display: grid; grid-template-columns: 96px 1fr auto; gap: 6px 12px; margin-bottom: 4px; }
.parse .src { color: var(--muted); font-family: "Atkinson Hyperlegible Mono", ui-monospace, monospace; }
.parse .need { color: var(--late); }
.say { background: var(--sheet); border: 1.5px solid var(--ink); border-radius: 4px; padding: 10px 12px; margin: 14px 0 10px; }
.say .m { display: block; }
.hint { color: var(--muted); }
.hint p { margin: 0 0 8px; }
.hint code { font-family: "Atkinson Hyperlegible Mono", ui-monospace, monospace; color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); padding: 0 4px; border-radius: 3px; }

/* legend */
.legend { display: flex; gap: 18px; padding: 6px 18px; border-top: 1px solid var(--rule-strong); background: var(--paper); color: var(--muted); white-space: nowrap; overflow: hidden; }
.legend span { display: inline-flex; gap: 5px; align-items: baseline; }
.toast { position: fixed; left: 18px; bottom: 44px; background: var(--ink); color: var(--sheet); padding: 8px 12px; border-radius: 4px; display: none; }
.toast.show { display: block; }
</style>
</head>

document.addEventListener('click', e => {
  const r = e.target.closest('tr[data-k]'); if (r) { PAY = null; SEL = r.dataset.k; MODE = 'sheet'; C = null; $('#cmd').value = ''; renderAll(); return; }
  const wl = e.target.closest('[data-wl]'); if (wl) { const x = selected(); if (x && x.g) fillGap(x.g, WAITLIST.find(w => w.patient === wl.dataset.wl)); return; }
  const f = e.target.closest('[data-f]'); if (f) { FILTER = f.dataset.f || null; renderAll(); return; }
  if (e.target.closest('[data-fold]')) { SHOW_PAST = !SHOW_PAST; renderAll(); return; }
  const j = e.target.closest('[data-jump]'); if (j) { const w = j.dataset.jump; jump(r => w === 'gap' ? r.g : r.a && statusOf(r.a) === w); return; }
  const b = e.target.closest('[data-key]'); if (b) document.dispatchEvent(new KeyboardEvent('keydown', { key: b.dataset.key === 'Esc' ? 'Escape' : b.dataset.key.toLowerCase() }));
});

renderLegend();
SEL = 'a' + APPTS.find(a => a.status === 'late').id;
renderAll();
/* prototype entry points: #book types a phone booking, #gap fills the 11:15 cancellation */
if (location.hash === '#book') { $('#cmd').value = 'anna kow fu thu am priya'; $('#cmd').dispatchEvent(new Event('input')); $('#cmd').focus(); }
if (location.hash === '#gap') { const g = gapsFor('PN')[0]; SEL = 'g' + g.t + g.s; renderAll(); fillGap(g, waitlistFor(g)[0]); }
if (location.hash === '#fillsel') { const g = gapsFor('PN')[0]; SEL = 'g' + g.t + g.s; renderAll(); }
</script>
</body>
</html>
