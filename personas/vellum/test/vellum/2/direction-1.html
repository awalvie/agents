<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Front desk — Appointment book</title>
<style>
@layer tokens, base, layout, components;
@layer tokens {
  :root {
    --bg: oklch(0.975 0.004 240);
    --surface: #fff;
    --sunk: oklch(0.955 0.006 240);
    --line: oklch(0.89 0.008 240);
    --line-strong: oklch(0.8 0.01 240);
    --ink: oklch(0.24 0.02 250);
    --muted: oklch(0.5 0.015 250);
    --faint: oklch(0.64 0.012 250);
    --accent: oklch(0.52 0.11 200);        /* action + free slots */
    --accent-soft: oklch(0.95 0.035 200);
    --late: oklch(0.55 0.19 27);
    --late-soft: oklch(0.95 0.035 27);
    --ok: oklch(0.55 0.13 150);
    --ok-soft: oklch(0.95 0.04 150);
    --pay: oklch(0.62 0.13 70);
    --pay-soft: oklch(0.96 0.05 85);
    --insession: oklch(0.45 0.05 250);
    --off: repeating-linear-gradient(135deg, oklch(0.94 0.005 240) 0 6px, oklch(0.965 0.004 240) 6px 12px);
    --r: 4px;
    --ppm: 1.4px;              /* pixels per minute in the day grid */
    font-size: 13px;
  }
}
@layer base {
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; color: var(--ink); background: var(--bg); font-variant-numeric: tabular-nums; }
  button, input, select, textarea { font: inherit; color: inherit; }
  kbd { font: 11px/1 ui-monospace, "Cascadia Mono", Menlo, monospace; padding: 2px 4px; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 3px; color: var(--muted); background: var(--surface); }
  h1, h2, h3 { margin: 0; font-weight: 600; }
}
@layer layout {
  body { display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
  .top { display: flex; align-items: center; gap: 16px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .main { display: grid; grid-template-columns: 1fr 312px; min-height: 0; }
  .cal { display: grid; grid-template-rows: auto 1fr; min-height: 0; min-width: 0; background: var(--surface); border-right: 1px solid var(--line); }
  .rail { overflow: auto; padding: 12px 14px 24px; }
}
@layer components {
  .brand { font-weight: 600; white-space: nowrap; }
  .brand span { font-weight: 400; color: var(--muted); margin-left: 6px; }
  .datenav { display: flex; align-items: center; gap: 4px; margin-left: 8px; }
  .datenav h1 { font-size: 15px; margin-left: 10px; white-space: nowrap; }
  .btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r); padding: 5px 10px; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--sunk); }
  .btn.sm { padding: 2px 8px; font-size: 12px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: oklch(0.47 0.11 200); }
  .btn.primary kbd { background: transparent; color: #fff; border-color: oklch(1 0 0 / .5); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--accent); }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r); overflow: hidden; }
  .seg button { border: 0; background: var(--surface); padding: 5px 10px; cursor: pointer; }
  .seg button[aria-pressed=true] { background: var(--sunk); font-weight: 600; }
  .search { margin-left: auto; position: relative; }
  .search input { width: 280px; padding: 6px 30px 6px 10px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--bg); }
  .search kbd { position: absolute; right: 7px; top: 6px; }
  .found { position: absolute; right: 0; top: 34px; width: 380px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 6px; box-shadow: 0 8px 28px oklch(0.2 0.02 250 / .18); z-index: 30; display: none; }
  .found.open { display: block; }
  .found div { padding: 7px 10px; border-top: 1px solid var(--line); cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 0 8px; }
  .found div:first-child { border-top: 0; }
  .found div:hover { background: var(--accent-soft); }
  .found small { color: var(--muted); }

  /* column heads */
  .heads { display: grid; grid-template-columns: 52px repeat(6, minmax(0, 1fr)); border-bottom: 1px solid var(--line-strong); }
  .head { padding: 7px 10px 6px; border-left: 1px solid var(--line); min-width: 0; }
  .head b { display: block; font-size: 13px; }
  .head small { color: var(--muted); font-size: 12px; white-space: nowrap; }

  .scroll { overflow: auto; min-height: 0; position: relative; }
  .grid { display: grid; grid-template-columns: 52px repeat(6, minmax(0, 1fr)); position: relative; }
  .gutter { position: relative; }
  .gutter span { position: absolute; right: 8px; font-size: 11px; color: var(--muted); transform: translateY(-50%); }
  .col { position: relative; border-left: 1px solid var(--line); background:
      repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px calc(var(--ppm) * 30)),
      var(--surface); }
  .col .off { position: absolute; left: 0; right: 0; background: var(--off); }
  .col .off span { position: sticky; top: 0; display: block; padding: 4px 8px; font-size: 11px; color: var(--faint); }
  .past { position: absolute; left: 0; right: 0; top: 0; background: oklch(0.5 0.01 250 / .045); pointer-events: none; z-index: 1; }
  .now { position: absolute; left: 0; right: 0; height: 0; border-top: 2px solid var(--late); z-index: 5; pointer-events: none; }
  .now span { position: absolute; left: 2px; top: -9px; background: var(--late); color: #fff; font-size: 11px; font-weight: 600; padding: 1px 4px; border-radius: 3px; }

  .appt { position: absolute; left: 3px; right: 3px; border-radius: var(--r); padding: 3px 6px 2px 8px; overflow: hidden; cursor: pointer; z-index: 2;
    background: oklch(0.965 0.012 240); border: 1px solid oklch(0.88 0.02 240); border-left: 3px solid oklch(0.62 0.05 250); line-height: 1.3; }
  .appt:hover { border-color: var(--insession); }
  .appt .l1 { display: flex; gap: 6px; align-items: baseline; white-space: nowrap; }
  .appt .l1 b { overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .appt .t { color: var(--muted); font-size: 11px; }
  .appt .l2 { color: var(--muted); font-size: 12px; white-space: nowrap; display: flex; gap: 6px; align-items: baseline; }
  .appt .l2 > span:first-child { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .appt .chip { margin-left: auto; }
  .appt.short { padding-top: 1px; }
  .appt.short .l2 { display: none; }
  .appt.done { background: var(--surface); border-color: var(--line); border-left-color: var(--line-strong); color: var(--muted); }
  .appt.done .l1 b { font-weight: 500; }
  .appt.in { background: oklch(0.93 0.02 250); border-left-color: var(--insession); }
  .appt.arrived { background: var(--ok-soft); border-color: oklch(0.85 0.06 150); border-left-color: var(--ok); }
  .appt.late { background: var(--late-soft); border-color: oklch(0.84 0.07 27); border-left-color: var(--late); }
  .appt.dna { background: var(--surface); border-style: dashed; border-left: 3px solid var(--late); color: var(--muted); }
  .appt.topay { border-left-color: var(--pay); }
  .appt.fresh { box-shadow: 0 0 0 2px var(--accent); }
  .appt.ghost { background: var(--accent-soft); border: 1px dashed var(--accent); border-left: 3px solid var(--accent); z-index: 4; pointer-events: none; }
  .res { font-size: 11px; font-weight: 600; color: oklch(0.45 0.09 300); background: oklch(0.95 0.03 300); padding: 0 4px; border-radius: 3px; }
  .chip { font-size: 11px; font-weight: 600; padding: 0 5px; border-radius: 3px; white-space: nowrap; }
  .chip.late { color: #fff; background: var(--late); }
  .chip.ok { color: #fff; background: var(--ok); }
  .chip.in { color: var(--insession); background: oklch(0.88 0.02 250); }
  .chip.pay { color: oklch(0.38 0.08 70); background: var(--pay-soft); border: 1px solid oklch(0.85 0.08 80); }
  .chip.dna { color: var(--late); border: 1px solid currentColor; }

  .gap { position: absolute; left: 3px; right: 3px; border: 1.5px dashed var(--accent); border-radius: var(--r); background: var(--accent-soft); z-index: 2;
    color: var(--accent); padding: 3px 7px; cursor: pointer; line-height: 1.3; overflow: hidden; }
  .gap:hover { background: oklch(0.92 0.05 200); }
  .gap b { font-weight: 600; }
  .gap small { display: block; color: oklch(0.42 0.07 200); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gap .add { float: right; font-weight: 700; }

  /* rail */
  .rail h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 6px; display: flex; justify-content: space-between; }
  .rail h2:first-child { margin-top: 2px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
  .item { padding: 8px 10px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
  .item:first-child { border-top: 0; }
  .item .who { font-weight: 600; }
  .item .meta { color: var(--muted); font-size: 12px; grid-column: 1; }
  .item .note { color: var(--ink); font-size: 12px; grid-column: 1 / -1; }
  .item .acts { grid-column: 1 / -1; display: flex; gap: 6px; margin-top: 4px; }
  .item.click { cursor: pointer; }
  .item.click:hover { background: var(--sunk); }
  .count { font-weight: 600; color: var(--ink); }

  /* appointment popover */
  .pop { position: fixed; z-index: 30; width: 290px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; box-shadow: 0 8px 28px oklch(0.2 0.02 250 / .18); padding: 12px; display: none; }
  .pop.open { display: block; }
  .pop h3 { font-size: 15px; }
  .pop .meta { color: var(--muted); margin: 2px 0 8px; }
  .pop .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .pop dl { display: grid; grid-template-columns: 70px 1fr; gap: 3px 8px; margin: 0; font-size: 12.5px; }
  .pop dt { color: var(--muted); }
  .pop dd { margin: 0; }

  /* booking drawer */
  .scrim { position: fixed; inset: 0; background: oklch(0.2 0.02 250 / .12); z-index: 20; display: none; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 460px; background: var(--surface); z-index: 21; border-left: 1px solid var(--line-strong);
    box-shadow: -12px 0 32px oklch(0.2 0.02 250 / .12); display: none; grid-template-rows: auto 1fr auto; }
  body.booking .drawer { display: grid; }
  body.booking .scrim { display: block; }
  .dh { padding: 14px 18px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
  .dh h2 { font-size: 16px; }
  .dh .x { margin-left: auto; }
  .db { overflow: auto; padding: 6px 18px 18px; }
  .field { margin-top: 14px; }
  .field > label, .field > .lab { display: block; font-weight: 600; margin-bottom: 5px; }
  .field .hint { color: var(--muted); font-weight: 400; font-size: 12px; }
  .inp { width: 100%; padding: 7px 9px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); }
  .inp:focus, .btn:focus-visible, .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .results { border: 1px solid var(--line-strong); border-top: 0; border-radius: 0 0 var(--r) var(--r); }
  .results div { padding: 6px 9px; cursor: pointer; display: flex; gap: 10px; }
  .results div[aria-selected=true], .results div:hover { background: var(--accent-soft); }
  .results small { color: var(--muted); margin-left: auto; }
  .picked { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--sunk); }
  .picked b { font-size: 14px; }
  .picked small { color: var(--muted); display: block; }
  .picked .btn { margin-left: auto; }
  .sugg { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .opt { border: 1px solid var(--line-strong); border-radius: var(--r); padding: 6px 9px; cursor: pointer; background: var(--surface); text-align: left; }
  .opt small { display: block; color: var(--muted); font-size: 12px; }
  .opt[aria-pressed=true] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
  .opt[disabled] { opacity: .45; cursor: not-allowed; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .check { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--r); font-size: 12.5px; }
  .check.ok { background: var(--ok-soft); color: oklch(0.38 0.1 150); }
  .check.bad { background: var(--late-soft); color: var(--late); }
  .df { border-top: 1px solid var(--line); padding: 12px 18px 16px; background: var(--sunk); }
  .df .say { font-size: 13px; margin-bottom: 10px; }
  .df .say small { display: block; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 2px; }
  .df .acts { display: flex; gap: 8px; align-items: center; }
  .df label { margin-right: auto; display: flex; gap: 6px; align-items: center; font-size: 12.5px; }

  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 14px; border-radius: 6px; z-index: 40; display: none; gap: 12px; align-items: center; }
  .toast.show { display: flex; }
  .toast button { background: none; border: 0; color: oklch(0.85 0.08 200); font-weight: 600; cursor: pointer; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Hollis Street Physio<span>Front desk</span></div>
  <div class="datenav">
    <button class="btn" aria-label="Previous day">‹</button>
    <button class="btn">Today</button>
    <button class="btn" aria-label="Next day">›</button>
    <h1>Tuesday 29 September 2026</h1>
  </div>
  <div class="search"><input id="find" autocomplete="off" placeholder="Find patient — name or phone"><kbd>/</kbd><div class="found" id="found"></div></div>
  <button class="btn primary" id="newBtn">New appointment <kbd>N</kbd></button>
</header>
<div class="main">
  <section class="cal" aria-label="Day schedule">
    <div class="heads" id="heads"></div>
    <div class="scroll" id="scroll"><div class="grid" id="grid"></div></div>
  </section>
  <aside class="rail" id="rail"></aside>
</div>

<div class="pop" id="pop" role="dialog"></div>
<div class="scrim" id="scrim"></div>
<form class="drawer" id="drawer" aria-label="New appointment" onsubmit="return false">

  <div class="db" id="dBody"></div>
  <div class="df" id="dFoot"></div>
</form>
<div class="toast" id="toast"></div>

  const booked = APPTS.filter(a => a.t === t && occupies(a)).sort((a, b) => a.start - b.start);
  for (const [s0, e0] of workSegments(t)) {
    let cur = s0;
    for (const a of booked) {
      if (a.start + a.dur <= s0 || a.start >= e0) continue;
      if (a.start > cur) out.push([cur, a.start]);
      cur = Math.max(cur, a.start + a.dur);
    }
    if (cur < e0) out.push([cur, e0]);
  }
  return out.map(([s, e]) => [Math.max(s, Math.ceil(from / 5) * 5), e]).filter(([s, e]) => e - s >= 20)
    .map(([s, e]) => {
      const c = APPTS.find(a => a.t === t && a.status === 'cancelled' && a.start >= s && a.start < e);
      return { t, s, e, len: e - s, cancelled: c || null };
    });
}
function allGaps() {
  return THERAPISTS.flatMap(t => gapsFor(t.id)).sort((a, b) => a.s - b.s || a.t.localeCompare(b.t));
}
/* what fits in a gap: treatments the therapist does, with any room or machine free */
function fitsGap(g) {
  return TREATMENTS.filter(tr => tr.dur <= g.len && canDo(g.t, tr.id) && resourceFree(tr.needs, g.s, g.s + tr.dur));
}
const WINDOWS = {
  'Any time today or tomorrow': [0, 1440, 1], 'After 14:00': [840, 1440, 4], 'Mornings': [0, 720, 4],
  'Before 17:00': [0, 1020, 4], 'After 15:00': [900, 1440, 4], 'Evenings': [1020, 1440, 4],
};
function waitlistFor(g) {
  return WAITLIST.filter(w => {
    const tr = TRT[w.tr], [f, to] = WINDOWS[w.window];
    return tr.dur <= g.len && canDo(g.t, w.tr) && (!w.pref || w.pref === g.t) &&
      g.s >= f && g.s + tr.dur <= to && resourceFree(tr.needs, g.s, g.s + tr.dur);
  });
}
/* deterministic pseudo-availability for future days (placeholder data) */
function rng(seed) { let x = seed; return () => (x = (x * 16807) % 2147483647) / 2147483647; }
function futureFree(day, t) {
  const r = rng(day * 97 + t.charCodeAt(0) * 13 + t.charCodeAt(1)), th = TH[t], out = [];
  const n = 3 + Math.floor(r() * 3);
  for (let k = 0; k < n; k++) {
    const s = th.start + Math.floor(r() * ((th.end - th.start - 45) / 15)) * 15;
    const len = [30, 45, 45, 60, 90][Math.floor(r() * 5)];
    if (th.brk.some(b => s < b[1] && s + len > b[0])) continue;
    if (out.some(o => s < o[1] && s + len > o[0])) continue;
    out.push([s, Math.min(s + len, th.end)]);
  }
  return out.sort((a, b) => a[0] - b[0]);
}
/* slot finder: returns start times that fit treatment, therapist, day and window */
function findSlots({ tr, t = null, days = [0, 1, 2, 3, 4], win = [0, 1440], pref = null, every = false }) {
  const T = TRT[tr], out = [];
  for (const d of days) for (const th of THERAPISTS) {
    if (t && th.id !== t) continue;
    if (!canDo(th.id, tr)) continue;
    const free = d === 0 ? gapsFor(th.id).map(g => [g.s, g.e]) : futureFree(d, th.id);
    for (const [s, e] of free) {
      for (let m = s; m + T.dur <= e; m += 15) {
        if (m < win[0] || m + T.dur > win[1]) continue;
        const resOk = d === 0 ? resourceFree(T.needs, m, m + T.dur) : (!T.needs || (m / 15 + d) % 7 !== 3);
        if (!resOk) continue;
        out.push({ d, t: th.id, s: m, e: m + T.dur, room: T.needs === 'Studio' ? 'Studio' : th.room, machine: T.needs === 'Shockwave unit' ? T.needs : null, pref: pref === th.id });
        if (!every) break; /* first start in each free stretch is enough */
      }
    }
  }
  return out.sort((a, b) => (b.pref - a.pref) || a.d - b.d || a.s - b.s);
}
/* patients */
const PATIENTS = (() => {
  const seen = new Map();
  const add = (name, phone) => { if (!seen.has(name)) seen.set(name, { name, phone }); };
  APPTS.forEach(a => add(a.patient, a.phone)); WAITLIST.forEach(w => add(w.patient, w.phone));
  OTHER_PATIENTS.forEach(p => add(p.patient, p.phone));
  let i = 0;
  return [...seen.values()].map(p => {
    const h = [...p.name].reduce((x, c) => (x * 31 + c.charCodeAt(0)) % 100000, 7);
    const last = APPTS.find(a => a.patient === p.name);
    return { ...p, id: 'P' + (4100 + (i++)), dob: pad(1 + h % 28) + '/' + pad(1 + h % 12) + '/' + (1948 + h % 58),
      usual: last ? last.t : (WAITLIST.find(w => w.patient === p.name) || {}).pref || null };
  });
})();
function searchPatients(q) {
  q = q.trim().toLowerCase(); if (!q) return [];
  const toks = q.split(/\s+/), digits = q.replace(/\D/g, '');
  return PATIENTS.filter(p => {
    if (digits.length >= 3 && p.phone.replace(/\D/g, '').includes(digits)) return true;
    const parts = p.name.toLowerCase().split(' ');
    return toks.every(tk => parts.some(pt => pt.startsWith(tk)));
  }).slice(0, 6);
}
function readBack(slot, tr) {
  const T = TRT[tr], d = DAYS[slot.d];
  return `${d.say.charAt(0).toUpperCase() + d.say.slice(1)} at ${fmt(slot.s)} with ${TH[slot.t].first}, ${slot.room}` +
    `${slot.machine ? ' (shockwave unit booked)' : ''}. ${T.dur}-minute ${T.name.toLowerCase()}, ${money(T.price)}.`;
}
let NEXT_ID = 900;
function commitBooking(slot, tr, patient) {
  const a = { id: NEXT_ID++, t: slot.t, start: slot.s, dur: TRT[tr].dur, tr, patient: patient.name, phone: patient.phone,
    room: slot.room, machine: slot.machine, status: 'booked', paid: false, note: 'Booked just now', fresh: true };
  if (slot.d === 0) APPTS.push(a);

}

/* one-step undo: snapshot before each change, restore on undo */
let UNDO = null;
function snap() { UNDO = JSON.stringify({ A: APPTS, W: WAITLIST }); }
function undo() {
  if (!UNDO) return false;
  const o = JSON.parse(UNDO); APPTS.splice(0, APPTS.length, ...o.A); WAITLIST.splice(0, WAITLIST.length, ...o.W); UNDO = null; return true;
}
/* shorten a late appointment so it still ends on time: starts at the ETA if we know it, else now */
function shortenPlan(a) { const s = Math.max(NOW, a.eta || NOW); return { s, dur: a.start + a.dur - s }; }
function applyShorten(a) { const p = shortenPlan(a); a.start = p.s; a.dur = p.dur; a.status = 'booked'; a.note = `Shortened to ${p.dur} min — ${a.eta ? 'ETA ' + fmt(a.eta) : 'starts when here'}`; }
/* today's appointments for a patient search, soonest first, cancelled left out */
function apptsFor(q) {
  const names = searchPatients(q).map(p => p.name);
  return APPTS.filter(a => occupies(a) && names.includes(a.patient));
}


const $ = s => document.querySelector(s);
const y = m => (m - OPEN) * 1.4;
const DAY_END = 1200;
const statusOf = a => a.status === 'done' && !a.paid ? 'topay' : a.status;

function chip(a) {
  const s = statusOf(a);
  if (s === 'late') return `<span class="chip late">Late ${NOW - a.start}m</span>`;
  if (s === 'arrived') return `<span class="chip ok">Arrived</span>`;
  if (s === 'in') return `<span class="chip in">In session</span>`;
  if (s === 'topay') return `<span class="chip pay">To pay ${money(TRT[a.tr].price)}</span>`;
  if (s === 'dna') return `<span class="chip dna">DNA</span>`;
  return '';
}

function renderHeads() {
  $('#heads').innerHTML = '<div></div>' + THERAPISTS.map(t => {
    return `<div class="head"><b>${t.name}</b><small>${fmt(t.start)}–${fmt(t.end)} · ${t.room}</small></div>`;
  }).join('');
}

function renderGrid() {
  const H = y(DAY_END);
  let g = `<div class="gutter" style="height:${H}px">`;
  for (let m = OPEN + 30; m < DAY_END; m += 30) if (m % 60 === 0 || true) g += `<span style="top:${y(m)}px">${m % 60 ? '' : fmt(m)}</span>`;
  g += '</div>';
  for (const t of THERAPISTS) {
    g += `<div class="col" data-t="${t.id}" style="height:${H}px">`;
    const offs = [[OPEN, t.start, 'Not working'], ...t.brk.map(b => [b[0], b[1], 'Lunch']), [t.end, DAY_END, 'Not working']];
    for (const [s, e, lab] of offs) if (e > s) g += `<div class="off" style="top:${y(s)}px;height:${y(e) - y(s)}px"><span>${lab}</span></div>`;
    for (const gp of gapsFor(t.id)) {
      const wl = waitlistFor(gp).length;
      g += `<div class="gap" data-gap="${t.id}-${gp.s}" style="top:${y(gp.s) + 1}px;height:${y(gp.e) - y(gp.s) - 2}px" title="Book into this free time">
        <span class="add">+</span><b>Free ${fmtDur(gp.len)}</b> <span>${fmt(gp.s)}</span>
        <small>${wl ? wl + ' waitlist fit' : ''}${gp.cancelled && wl ? ' · ' : ''}${gp.cancelled ? 'was ' + esc(initialName(gp.cancelled.patient)) : ''}</small></div>`;
    }
    for (const a of APPTS.filter(a => a.t === t.id && occupies(a))) {
      const T = TRT[a.tr], st = statusOf(a), h = y(a.start + a.dur) - y(a.start) - 2;
      const res = a.room === 'Studio' ? '<span class="res">Studio</span>' : a.machine ? `<span class="res" title="Uses the shockwave unit">${h < 36 ? 'Shock' : 'Shockwave'}</span>` : '';
      g += `<div class="appt ${st} ${h < 36 ? 'short' : ''} ${a.fresh ? 'fresh' : ''}" data-id="${a.id}" style="top:${y(a.start) + 1}px;height:${h}px">
        <div class="l1"><span class="t">${fmt(a.start)}</span><b>${esc(h < 36 ? initialName(a.patient) : a.patient)}</b>${h < 36 ? res + chip(a) : ''}</div>

  g += `<div class="now" style="top:${y(NOW)}px;left:52px"><span>${fmt(NOW)}</span></div>`;

}

      <span class="meta">${TRT[w.tr].name}${w.pref ? ' · ' + TH[w.pref].first : ''} · ${w.window}</span></div>`).join('')}</div>`;
}

  if (st === 'in' || st === 'topay' || st === 'arrived') acts += `<button class="btn ${st === 'topay' ? 'primary' : ''} sm" data-act="pay" data-id="${a.id}">Take payment ${money(T.price)}</button>`;
  if (st !== 'done' && st !== 'topay') acts += `<button class="btn sm" data-act="move" data-id="${a.id}">Move</button><button class="btn sm" data-act="cancel" data-id="${a.id}">Cancel</button>`;
  if (st === 'late') acts += `<button class="btn sm" data-act="dna" data-id="${a.id}">Did not attend</button>`;

function drawGhost() {

  g.innerHTML = `<div class="l1"><span class="t">${fmt(B.s)}</span><b>${B.patient ? esc(B.patient.name) : 'New appointment'}</b></div><div class="l2">${T.name}</div>`;

function book() {
  if (!B || !B.slot || !B.patient) return;
  snap();
  if (B.moving) {
    const a = APPTS.find(x => x.id === B.moving);
    if (B.d === 0) { a.note = 'Moved from ' + fmt(a.start); a.start = B.slot.s; a.t = B.slot.t; a.room = B.slot.room; a.machine = B.slot.machine; a.status = 'booked'; a.fresh = true; }
    else { a.status = 'cancelled'; a.note = `Moved to ${DAYS[B.d].short} ${fmt(B.slot.s)}`; }
  } else commitBooking(B.slot, B.tr, B.patient);
  const msg = `${B.moving ? 'Moved' : 'Booked'} ${B.patient.name} · ${DAYS[B.d].short} ${fmt(B.slot.s)} with ${TH[B.slot.t].first}${B.text ? ' · confirmation texted' : ''}`;
  if (B.gap) { const w = WAITLIST.findIndex(w => w.patient === B.patient.name); if (w >= 0) WAITLIST.splice(w, 1); }
  closeBooking(); renderAll(); toast(msg);
}
function toast(m, canUndo = true) { const t = $('#toast'); t.innerHTML = `${esc(m)}${canUndo ? ' <button id="undo">Undo</button>' : ''}`; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 5000); }

/* ---------- events ---------- */
function gapFromKey(k) { const [t, s] = k.split('-'); return gapsFor(t).find(g => g.s === +s); }
document.addEventListener('click', e => {
  const act = e.target.closest('[data-act]');
  if (act) {
    const a = APPTS.find(x => x.id === +act.dataset.id), k = act.dataset.act;
    if (k !== 'move') snap();
    if (k === 'checkin') { a.status = a.start + a.dur <= NOW ? 'done' : 'arrived'; toast(`Checked in ${a.patient}`); }
    if (k === 'pay') { a.paid = true; if (a.status !== 'in') a.status = 'done'; toast(`Paid ${money(TRT[a.tr].price)} by card · ${a.patient} · receipt texted`, false); }
    if (k === 'cancel') { a.status = 'cancelled'; a.note = 'Cancelled at the desk ' + fmt(NOW); toast(`Cancelled ${a.patient} ${fmt(a.start)} — ${a.dur} min now free`); }
    if (k === 'dna') { a.status = 'dna'; toast(`${a.patient} marked did not attend`); }
    if (k === 'move') { const p = PATIENTS.find(p => p.name === a.patient); openBooking({ patient: p, tr: a.tr, t: a.t, d: 0, moving: a.id }); renderAll(); return; }
    closePop(); renderAll(); return;
  }
  if (e.target.id === 'undo') { if (undo()) { renderAll(); toast('Undone', false); } return; }
  const fd = e.target.closest('[data-found]');
  if (fd) { $('#found').classList.remove('open'); $('#find').value = '';
    const [kind, v] = fd.dataset.found.split(':');
    if (kind === 'a') { const el = document.querySelector(`.appt[data-id="${v}"]`); el.scrollIntoView({ block: 'center' }); openPop(APPTS.find(x => x.id === +v), el); }
    else openBooking({ patient: PATIENTS.find(p => p.id === v) });
    return; }
  if (!e.target.closest('.search')) $('#found').classList.remove('open');
  const ap = e.target.closest('.appt:not(.ghost)'); if (ap) { openPop(APPTS.find(x => x.id === +ap.dataset.id), ap); return; }
  const gp = e.target.closest('[data-gap]');
  if (gp) { const g = gapFromKey(gp.dataset.gap); const f = fitsGap(g); openBooking({ t: g.t, s: g.s, d: 0, gap: g, tr: f.some(x => x.id === 'FU') ? 'FU' : f[0].id }); return; }
  if (!e.target.closest('#pop')) closePop();
  if (e.target.id === 'scrim' || e.target.id === 'dClose' || e.target.id === 'dCancel') closeBooking();
  if (e.target.id === 'newBtn') openBooking();
  if (!B) return;
  const tr = e.target.closest('[data-tr]'); if (tr && !tr.disabled) { B.tr = tr.dataset.tr; renderDrawer(); }
  const pi = e.target.closest('[data-pi]'); if (pi) { B.patient = searchPatients(B.q)[+pi.dataset.pi]; if (!B.gap && B.patient.usual) B.t = B.patient.usual; renderDrawer(); }
  const wl = e.target.closest('[data-wl]'); if (wl) { const w = WAITLIST.find(w => w.patient === wl.dataset.wl); B.patient = PATIENTS.find(p => p.name === w.patient); B.tr = w.tr; renderDrawer(); }
  if (e.target.id === 'pChange') { B.patient = null; renderDrawer(true); }
  if (e.target.closest('#dBook')) book();
});
document.addEventListener('input', e => {
  if (e.target.id === 'find') {
    const q = e.target.value, f = $('#found');
    if (q.trim().length < 2) { f.classList.remove('open'); return; }
    const ps = searchPatients(q);
    f.innerHTML = ps.length ? ps.map(p => { const a = APPTS.find(x => x.patient === p.name && occupies(x));
      return a ? `<div data-found="a:${a.id}"><b>${esc(p.name)}</b><small>today ${fmt(a.start)} · ${TH[a.t].first}</small><small>${p.phone}</small><small>${{ done: 'seen', topay: 'to pay', dna: 'did not attend', late: 'running late', in: 'in session', arrived: 'here', booked: 'booked' }[statusOf(a)]}</small></div>`
        : `<div data-found="p:${p.id}"><b>${esc(p.name)}</b><small>nothing today — book</small><small>${p.phone}</small></div>`; }).join('')
      : `<div><small>No patient matches “${esc(q)}”.</small></div>`;
    f.classList.add('open'); return;
  }
  if (!B) return;
  if (e.target.id === 'pq') { B.q = e.target.value; B.sel = 0; renderDrawer(); const i = $('#pq'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
});
document.addEventListener('change', e => {
  if (!B) return;
  if (e.target.id === 'dT') { B.t = e.target.value; B.gap = null; renderDrawer(); }
  if (e.target.id === 'dD') { B.d = +e.target.value; B.gap = null; B.s = null; renderDrawer(); }
  if (e.target.id === 'dS') { B.s = +e.target.value; renderDrawer(); }
  if (e.target.id === 'dTxt') B.text = e.target.checked;
});
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (e.key === 'Escape') { if (B) closeBooking(); closePop(); $('#found').classList.remove('open'); return; }
  if (B && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { book(); return; }
  if (B && document.activeElement.id === 'pq') {
    const res = searchPatients(B.q);
    if (e.key === 'ArrowDown') { B.sel = Math.min(res.length - 1, B.sel + 1); renderDrawer(); $('#pq').focus(); e.preventDefault(); }
    if (e.key === 'ArrowUp') { B.sel = Math.max(0, B.sel - 1); renderDrawer(); $('#pq').focus(); e.preventDefault(); }
    if (e.key === 'Enter' && res[B.sel]) { B.patient = res[B.sel]; if (!B.gap && B.patient.usual) B.t = B.patient.usual; renderDrawer(); e.preventDefault(); }
    return;
  }
  if (typing) return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); openBooking(); }
  if (e.key === '/') { e.preventDefault(); $('#find').focus(); }
});

renderAll();
$('#scroll').scrollTop = Math.max(0, y(Math.floor((NOW - 90) / 30) * 30));
/* prototype entry points: #book opens a blank booking, #gap fills the 11:15 cancellation */
if (location.hash === '#book') { openBooking(); B.q = 'anna k'; renderDrawer(); }
if (location.hash === '#gap') { const g = gapsFor('PN')[0]; openBooking({ t: g.t, s: g.s, d: 0, gap: g }); const w = waitlistFor(g)[0]; B.patient = PATIENTS.find(p => p.name === w.patient); renderDrawer(); }
</script>
</body>
</html>
