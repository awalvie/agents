<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Front Desk · Gap Board</title>
<style>
:root{
 --bg:#f2f0eb;--card:#fff;--line:#e4e0d7;--line2:#efece6;--ink:#211f1b;--ink2:#625d53;--ink3:#9a948a;
 --gap:#d98600;--gap-soft:#fff1d4;--gap-ink:#7a4a00;--late:#cc3b2f;--late-soft:#fdebe8;--ok:#2b7d4f;--ok-soft:#e4f3ea;--act:#3c4fd1;--act-soft:#eceefd;--busy:#d9d4c9;--past:#e9e6df;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:13.5px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.tn{font-variant-numeric:tabular-nums}
kbd{font:600 11px ui-monospace,Menlo,monospace;background:rgba(0,0,0,.06);border-radius:4px;padding:1px 5px}

header{flex:none;height:56px;display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{font-weight:750;font-size:15px}
.brand span{font-weight:400;color:var(--ink3)}
.when{display:flex;align-items:baseline;gap:8px}
.when b{font-size:18px}
.when span{color:var(--ink2)}
.search{margin-left:auto;width:300px;height:36px;border:1px solid var(--line);border-radius:9px;padding:0 12px;font:inherit;background:var(--bg)}
.cta{height:38px;border:0;border-radius:9px;background:var(--act);color:#fff;font-weight:650;padding:0 16px;display:flex;gap:10px;align-items:center}
.cta kbd{background:rgba(255,255,255,.2);color:#fff}
.cta:hover{background:#2f40b3}

/* timeline band */
.band{flex:none;background:var(--card);border-bottom:1px solid var(--line);padding:10px 20px 8px}
.band .top{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.band .top h2{margin:0;font-size:13px;font-weight:650}
.leg{display:flex;gap:14px;color:var(--ink2);font-size:12px}
.leg i{display:inline-block;width:14px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.tl{display:grid;grid-template-columns:112px 1fr;row-gap:4px;align-items:center}
.tl .nm{font-size:12.5px;white-space:nowrap;color:var(--ink2)}
.tl .nm b{color:var(--ink);font-weight:600}
.tl .nm.res{font-size:11.5px;color:var(--ink3)}
.lane{position:relative;height:22px;border-radius:5px;background:repeating-linear-gradient(135deg,#f6f4f0 0 5px,#eeebe4 5px 6px)}
.lane.res{height:10px}
.lane .on{position:absolute;top:0;bottom:0;background:#faf9f6;border-radius:5px}
.lane .a{position:absolute;top:2px;bottom:2px;border-radius:3px;background:var(--busy);box-shadow:0 0 0 1px #fff}
.lane .a.past{background:var(--past)}
.lane .a.late{background:var(--late)}
.lane .a.here{background:#9fcfb2}
.lane .a.new{background:var(--act)}
.lane.res .a{top:1px;bottom:1px;background:#b9a7e3}
.lane .g{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--gap);cursor:pointer;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff}
.lane .g:hover,.lane .g.sel{box-shadow:0 0 0 2px var(--ink)}
.lane .k{position:absolute;top:-2px;bottom:-2px;border-radius:4px;border:2px solid var(--act);background:rgba(60,79,209,.2);z-index:3}
.now{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--late);z-index:2}
.axis{position:relative;height:14px;font-size:10.5px;color:var(--ink3)}
.axis span{position:absolute;transform:translateX(-50%)}
.nowtag{position:absolute;transform:translateX(-50%);top:0;background:var(--late);color:#fff;border-radius:3px;padding:0 4px;font-weight:600}

/* board */
.board{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:16px;padding:16px 20px}
.colm{display:flex;flex-direction:column;min-height:0}
.colm>h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
.colm>h3 .n{background:var(--ink);color:#fff;border-radius:10px;font-size:11.5px;padding:0 8px;line-height:19px}
.colm>h3 .sub{font-weight:400;color:var(--ink3);font-size:12.5px}
.scroll{overflow:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:20px}
.scroll>*{flex:none}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.c .l1{display:flex;align-items:baseline;gap:8px}
.c .who{font-weight:650;font-size:14px}
.c .tm{color:var(--ink2);font-size:12.5px}
.c .meta{color:var(--ink2);font-size:12.5px;margin-top:1px}
.c .st{margin-left:auto;font-size:11.5px;font-weight:650;border-radius:5px;padding:1px 7px;white-space:nowrap}
.c .btns{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.b{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 11px;font-size:12.5px;font-weight:550}
.b:hover{background:var(--bg)}
.b.p{background:var(--ink);border-color:var(--ink);color:#fff}
.b.p:hover{background:#000}
.b.g{background:var(--gap);border-color:var(--gap);color:#fff}
.b.g:hover{background:#bf7600}
.b.a{background:var(--act);border-color:var(--act);color:#fff}
.b.q{border-color:transparent;color:var(--ink2)}
.c.late{border-color:#efb3ab;background:linear-gradient(90deg,var(--late) 0 4px,var(--card) 4px)}
.c.late .st{background:var(--late-soft);color:var(--late)}
.c.soon .st{background:var(--bg);color:var(--ink2)}
.c.here .st{background:var(--ok-soft);color:var(--ok)}
.c.room .st{background:var(--act-soft);color:var(--act)}
.c.pay{border-color:#ecd29b}
.c.pay .st{background:var(--gap-soft);color:var(--gap-ink)}
.c.done{opacity:.55}
.gapc{border:1.5px solid #ebc47a;background:var(--card);border-radius:12px;overflow:hidden}
.gapc.sel{box-shadow:0 0 0 3px rgba(217,134,0,.35)}
.gapc .gh{background:var(--gap-soft);padding:10px 13px;display:flex;align-items:baseline;gap:10px;cursor:pointer}
.gapc .gh .big{font-size:16px;font-weight:700;color:var(--gap-ink)}
.gapc .gh .len{font-weight:650;color:var(--gap-ink)}
.gapc .gh .src{margin-left:auto;font-size:12px;color:var(--gap-ink);opacity:.85;text-align:right}
.cand{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:9px 13px;border-top:1px solid var(--line2);align-items:center}
.cand .nm{font-weight:650}
.cand .why{grid-column:1;display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;background:var(--bg);color:var(--ink2);border-radius:5px;padding:1px 6px;white-space:nowrap}
.chip.good{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--gap-soft);color:var(--gap-ink)}
.chip.res{background:#efe9fb;color:#5b3aa8}
.cand .acts{grid-row:1/span 2;grid-column:2;display:flex;gap:5px}
.cand.offered{background:#fbfaf7}
.offer{font-size:12px;color:var(--act);font-weight:600}
.none{padding:10px 13px;color:var(--ink2);font-size:12.5px;border-top:1px solid var(--line2)}
.empty{color:var(--ink3);font-size:13px;padding:14px;border:1.5px dashed var(--line);border-radius:12px;text-align:center}

/* finder overlay */
.finder{position:fixed;inset:56px 0 0 0;background:var(--bg);z-index:20;display:none;flex-direction:column}
.finder.open{display:flex}
.finder .fb{flex:1;min-height:0;display:grid;grid-template-columns:380px 1fr;gap:0}
.form{background:var(--card);border-right:1px solid var(--line);padding:18px 20px;overflow:auto}
.form h2{margin:0 0 2px;font-size:18px}
.form .hint{color:var(--ink3);font-size:12.5px;margin-bottom:10px}
.f{margin-top:16px}
.f>label{display:block;font-size:12px;font-weight:650;color:var(--ink2);margin-bottom:6px}
.inp{width:100%;height:38px;border:1px solid var(--line);border-radius:9px;padding:0 12px;font:inherit;font-size:14px}
.inp:focus{outline:none;border-color:var(--act);box-shadow:0 0 0 3px var(--act-soft)}
.res-list{border:1px solid var(--line);border-radius:9px;margin-top:5px;overflow:hidden}
.res-list div{padding:7px 12px;display:flex;justify-content:space-between;border-top:1px solid var(--line2);cursor:pointer}
.res-list div:first-child{border-top:0}
.res-list div:hover,.res-list div.on{background:var(--act-soft)}
.res-list small{color:var(--ink3)}
.pc{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.pc .g{flex:1}
.pc .t2{font-size:12.5px;color:var(--ink2)}
.seg{display:flex;flex-wrap:wrap;gap:5px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;font-size:12.5px}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.seg button small{opacity:.7;margin-left:4px}
.results{padding:18px 24px;overflow:auto}
.results h3{margin:0 0 4px;font-size:15px}
.results .hint{color:var(--ink3);font-size:12.5px;margin-bottom:12px}
.sug{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:grid;grid-template-columns:130px 1fr auto;gap:4px 16px;align-items:center;margin-bottom:8px}
.sug.best{border:2px solid var(--act);padding:11px 15px}
.sug .t{font-size:20px;font-weight:700;grid-row:1/span 2}
.sug .t small{display:block;font-size:12px;font-weight:500;color:var(--ink3)}
.sug .w{font-weight:650}
.sug .why{display:flex;flex-wrap:wrap;gap:4px}
.sug .go{grid-row:1/span 2;grid-column:3}
.rank{font-size:11px;font-weight:700;color:var(--act);text-transform:uppercase;letter-spacing:.05em;margin-right:6px}
.all{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.all h4{margin:0 0 8px;font-size:13px}
.allrow{display:grid;grid-template-columns:120px 1fr;gap:8px;padding:5px 0;border-top:1px solid var(--line2);align-items:center}
.allrow:first-of-type{border-top:0}
.allrow .ts{display:flex;flex-wrap:wrap;gap:4px}
.allrow .ts button{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:2px 7px;font-size:12px}
.allrow .ts button:hover{border-color:var(--act);color:var(--act)}
.allrow .ts button.on{background:var(--act);border-color:var(--act);color:#fff}
.allrow .no{color:var(--ink3);font-size:12px}
.confirmbar{position:sticky;bottom:0;margin-top:14px;background:var(--ink);color:#fff;border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:14px}
.confirmbar .g{flex:1}
.confirmbar small{color:#bdb8ad}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:10px;padding:10px 16px;display:none;z-index:40;gap:12px;align-items:center}
.toast button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;padding:3px 9px}
.proto{position:fixed;left:12px;bottom:12px;z-index:60;background:#111;color:#fff;border-radius:8px;padding:5px;display:flex;gap:4px;font-size:12px;opacity:.9}
.proto span{padding:4px 6px;color:#aaa}
.proto button{background:#333;border:0;color:#fff;border-radius:5px;padding:4px 9px}
.proto button.on{background:#fff;color:#111}
</style>
</head>
<body>
<header>
 <div class="brand">Fysio Nord <span>front desk</span></div>
 <div class="when"><b class="tn" id="clock"></b><span id="date"></span></div>
 <input class="search" id="search" placeholder="Find patient or phone">
 <button class="cta" id="findBtn">Find a time <kbd>F</kbd></button>
</header>
<section class="band">
 <div class="top"><h2>Today at a glance</h2><div class="leg"><span><i style="background:var(--busy)"></i>Booked</span><span><i style="background:var(--late)"></i>Late</span><span><i style="background:var(--gap)"></i>Open time, click to fill</span><span><i style="background:#b9a7e3"></i>Room or machine in use</span></div></div>
 <div class="tl" id="tl"></div>
</section>
<div class="board">
 <div class="colm"><h3>Arriving <span class="n" id="nArr"></span><span class="sub">late first, then next 40 min</span></h3><div class="scroll" id="arr"></div></div>
 <div class="colm"><h3>In the clinic <span class="n" id="nIn"></span><span class="sub">waiting, in a room, to pay</span></h3><div class="scroll" id="inc"></div></div>
 <div class="colm"><h3>Open time today <span class="n" id="nGap" style="background:var(--gap)"></span><span class="sub">best waitlist matches for each gap</span></h3><div class="scroll" id="gaps"></div></div>
</div>
<div class="finder" id="finder"></div>
<div class="toast" id="toast"></div>
<div class="proto"><span>Prototype</span><button id="pDay" class="on">Day view</button><button id="pBook">Booking</button></div>
<script>
// ---------- Mock data (same in all three directions) ----------
const pad=n=>String(n).padStart(2,'0');
const toMin=s=>{const[a,b]=s.split(':').map(Number);return a*60+b};
const fmt=n=>pad(Math.floor(n/60))+':'+pad(n%60);
const NOW=toMin('10:40');
const DAY_START=toMin('07:30'), DAY_END=toMin('19:30');
const DATE_LABEL='Saturday 26 September';
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(20260926);

const THERAPISTS=[
 {id:'IS',name:'Ingrid Solberg',first:'Ingrid',start:'07:30',end:'16:00',room:'R1',skills:['SW','GYM']},
 {id:'MR',name:'Marco Rossi',first:'Marco',start:'07:30',end:'14:00',room:'R2',skills:['LZ']},
 {id:'TB',name:'Tom Bakke',first:'Tom',start:'08:00',end:'17:30',room:'R5',skills:['SW','GYM'],lunch:['12:00','12:30']},
 {id:'JB',name:'Jonas Berg',first:'Jonas',start:'08:00',end:'16:00',room:'R6',skills:['GYM'],lunch:['12:30','13:00']},
 {id:'PN',name:'Priya Nair',first:'Priya',start:'09:30',end:'19:00',room:'R4',skills:['SW','LZ'],lunch:['14:00','14:30']},
 {id:'AL',name:'Ane Lund',first:'Ane',start:'11:30',end:'19:30',room:'R7',skills:['LZ','SW']},
];
THERAPISTS.forEach(t=>{t.s=toMin(t.start);t.e=toMin(t.end);t.ls=t.lunch?toMin(t.lunch[0]):null;t.le=t.lunch?toMin(t.lunch[1]):null;});
const TH=Object.fromEntries(THERAPISTS.map(t=>[t.id,t]));
const ROOMS={R1:'Room 1',R2:'Room 2',R3:'Room 3',R4:'Room 4',R5:'Room 5',R6:'Room 6',R7:'Room 7',GYM:'Gym',LASER:'Laser unit'};
const TREATMENTS=[
 {id:'FU',code:'fu',name:'Follow-up',dur:30,price:650,w:50},
 {id:'ASM',code:'as',name:'Initial assessment',dur:45,price:950,w:10},
 {id:'SM',code:'sm',name:'Sports massage',dur:45,price:750,w:9},
 {id:'DN',code:'dn',name:'Dry needling',dur:30,price:650,w:12},
 {id:'SW',code:'sw',name:'Shockwave',dur:30,price:850,w:10,skill:'SW',room:'R3',needs:'Room 3 (shockwave unit)'},
 {id:'GYM',code:'gy',name:'Rehab gym',dur:45,price:700,w:8,skill:'GYM',room:'GYM',needs:'Gym'},
 {id:'LZ',code:'lz',name:'Laser therapy',dur:30,price:600,w:6,skill:'LZ',device:'LASER',needs:'Laser unit'},
];
const TX=Object.fromEntries(TREATMENTS.map(t=>[t.id,t]));
const SKILL_NAME={SW:'shockwave',GYM:'gym',LZ:'laser'};

const FIRST=['Kari','Erik','Sofie','Lars','Nora','Henrik','Ingrid','Ola','Mia','Jonas','Emma','Jakob','Sara','Magnus','Ida','Filip','Thea','Anders','Julie','Mats','Hanne','Per','Silje','Aksel','Maja','Trond','Linnea','Oskar','Vilde','Eirik','Hedda','Sander','Tuva','Marius','Frida','Kristian','Amalie','Sindre','Ella','Geir','Leah','Omar','Ali','Anna','Petter','Rune'];
const LAST=['Hansen','Dahl','Brekke','Moen','Vik','Aas','Johansen','Larsen','Olsen','Eide','Haugen','Berg','Strand','Lie','Nilsen','Bakken','Solheim','Nygaard','Lunde','Holm','Kristiansen','Andersen','Pedersen','Aune','Rønning','Sæther','Myhre','Tveit','Foss','Hovland','Ali','Karim','Novak'];
const usedNames=new Set(['Kari Hansen','Erik Dahl','Sofie Brekke','Lars Moen','Nora Vik','Henrik Aas']);
const PATIENTS=[];
function phone(){return '9'+Math.floor(R()*10)+Math.floor(R()*10)+' '+pad(Math.floor(R()*100))+' '+String(Math.floor(R()*1000)).padStart(3,'0')}
function newPatient(){
 let n;do{n=FIRST[Math.floor(R()*FIRST.length)]+' '+LAST[Math.floor(R()*LAST.length)]}while(usedNames.has(n));
 usedNames.add(n);
 const p={name:n,phone:phone(),usual:THERAPISTS[Math.floor(R()*THERAPISTS.length)].id,visits:1+Math.floor(R()*14),balance:R()<0.08?650:0};
 PATIENTS.push(p);return p;
}

const APPTS=[];let nid=1;
function live(a){return a.status!=='cancelled'}
function resourceBusy(res,s,e,ignoreId){return APPTS.some(a=>a.id!==ignoreId&&live(a)&&(a.room===res||a.device===res)&&a.start<e&&s<a.end)}
function therapistBusy(tid,s,e,ignoreId){return APPTS.some(a=>a.id!==ignoreId&&live(a)&&a.t===tid&&a.start<e&&s<a.end)}
function works(t,s,e){return s>=t.s&&e<=t.e&&!(t.ls!=null&&s<t.le&&t.ls<e)}
function pickTx(){let x=R()*100,acc=0;for(const t of TREATMENTS){acc+=t.w;if(x<acc)return t}return TREATMENTS[0]}

(function generate(){
 const cur=Object.fromEntries(THERAPISTS.map(t=>[t.id,t.s]));
 let active=[...THERAPISTS];
 while(active.length){
  active.sort((a,b)=>cur[a.id]-cur[b.id]);
  const t=active[0];const c=cur[t.id];
  if(c>=t.e){active.shift();continue}
  if(t.ls!=null&&c>=t.ls&&c<t.le){cur[t.id]=t.le;continue}
  if(R()<0.045){cur[t.id]=c+(R()<0.6?15:30);continue}
  const ok=x=>{const e=c+x.dur;if(!works(t,c,e))return false;if(x.skill&&!t.skills.includes(x.skill))return false;if(x.room&&resourceBusy(x.room,c,e))return false;if(x.device&&resourceBusy(x.device,c,e))return false;return true};
  let x=pickTx();if(!ok(x))x=TX.FU;
  if(!ok(x)){cur[t.id]=c+15;continue}
  APPTS.push({id:nid++,t:t.id,start:c,end:c+x.dur,tx:x.id,patient:newPatient(),room:x.room||t.room,device:x.device||null,status:'booked',paid:false});
  cur[t.id]=c+x.dur;
 }
 APPTS.sort((a,b)=>a.start-b.start||THERAPISTS.indexOf(TH[a.t])-THERAPISTS.indexOf(TH[b.t]));
 APPTS.forEach(a=>{
  if(a.end<=NOW){a.status=R()<0.05?'noshow':'done';a.paid=a.status==='done'&&R()<0.85;a.arrivedAt=a.start-Math.floor(R()*10)}
  else if(a.start<=NOW){a.status='intreat';a.arrivedAt=a.start-Math.floor(R()*8)}
  else if(a.start-NOW<=20){if(R()<0.6){a.status='arrived';a.arrivedAt=NOW-Math.floor(R()*9)}}
 });
 // Late patients: started in the last 15 minutes but not here
 APPTS.filter(a=>a.start<NOW&&a.start>=NOW-15).slice(0,2).forEach(a=>{a.status='late';delete a.arrivedAt});
 // Cancellations this morning free up time later today
 const fut=APPTS.filter(a=>a.start>NOW+45&&a.status==='booked');
 const sw=fut.find(a=>a.tx==='SW'&&a.start<toMin('15:00'));
 const toCancel=[sw,fut.filter(a=>a.tx!=='SW'&&a.start<toMin('13:00'))[2],fut.filter(a=>a.tx!=='SW'&&a.start>toMin('15:00'))[4]].filter(Boolean);
 const times=['08:52','09:31','10:18'];
 toCancel.forEach((a,i)=>{a.status='cancelled';a.cancelledAt=times[i];a.cancelNote=['Called in sick','Work clash','Child ill'][i]});
})();

const WAITLIST=[
 {name:'Kari Hansen',phone:'912 34 567',tx:'FU',note:'Any therapist, any time today',since:'Mon',usual:'TB'},
 {name:'Erik Dahl',phone:'934 11 208',tx:'SW',before:toMin('15:00'),note:'Shockwave, before 15:00',since:'Tue',usual:'IS'},
 {name:'Sofie Brekke',phone:'401 22 918',tx:'ASM',therapists:['PN','AL'],after:toMin('15:00'),note:'Priya or Ane, after 15:00',since:'Wed'},
 {name:'Lars Moen',phone:'958 70 131',tx:'GYM',after:toMin('13:00'),note:'Afternoons only',since:'Wed',usual:'JB'},
 {name:'Nora Vik',phone:'476 03 552',tx:'FU',therapists:['IS','TB'],before:toMin('13:00'),note:'Ingrid or Tom, mornings',since:'Thu',usual:'IS'},
 {name:'Henrik Aas',phone:'922 58 004',tx:'DN',notice:30,note:'Lives nearby, 30 min notice',since:'Fri',usual:'MR'},
];

function gapsFor(t,from=NOW,min=30){
 const busy=APPTS.filter(a=>a.t===t.id&&live(a)).map(a=>[a.start,a.end]);
 if(t.ls!=null)busy.push([t.ls,t.le]);
 busy.sort((a,b)=>a[0]-b[0]);
 const out=[];let c=Math.max(t.s,Math.ceil(from/15)*15);
 for(const[s,e]of busy){if(e<=c)continue;if(s>c&&s-c>=min)out.push({t:t.id,start:c,end:s});c=Math.max(c,e)}
 if(t.e-c>=min)out.push({t:t.id,start:c,end:t.e});
 out.forEach(g=>{g.freedBy=APPTS.find(a=>a.status==='cancelled'&&a.t===t.id&&a.start<g.end&&g.start<a.end)});
 return out;
}
function allGaps(from=NOW){return THERAPISTS.flatMap(t=>gapsFor(t,from)).sort((a,b)=>a.start-b.start)}
function waitFits(w,t){const x=TX[w.tx];if(x.skill&&!t.skills.includes(x.skill))return false;if(w.therapists&&!w.therapists.includes(t.id))return false;return true}
function candidatesFor(g){
 const t=TH[g.t];
 return WAITLIST.map(w=>{
  if(!waitFits(w,t))return null;const x=TX[w.tx];
  let s=Math.max(g.start,w.after||0,w.notice?NOW+w.notice:0);s=Math.ceil(s/15)*15;
  for(;s+x.dur<=g.end;s+=15){
   if(w.before&&s+x.dur>w.before)break;
   if(x.room&&resourceBusy(x.room,s,s+x.dur))continue;
   if(x.device&&resourceBusy(x.device,s,s+x.dur))continue;
   return{w,start:s,end:s+x.dur,tx:x,usual:w.usual===t.id};
  }
  return null;
 }).filter(Boolean).sort((a,b)=>(b.usual-a.usual)||(a.start-b.start));
}
function findSlots({tx,therapists,from=NOW,to=DAY_END,ignoreId}){
 const x=TX[tx];const res=[];
 for(const t of THERAPISTS){
  if(therapists&&therapists.length&&!therapists.includes(t.id))continue;
  if(x.skill&&!t.skills.includes(x.skill))continue;
  for(let s=Math.max(t.s,Math.ceil(from/15)*15);s+x.dur<=Math.min(t.e,to);s+=15){
   const e=s+x.dur;
   if(!works(t,s,e)||therapistBusy(t.id,s,e,ignoreId))continue;
   if(x.room&&resourceBusy(x.room,s,e,ignoreId))continue;
   if(x.device&&resourceBusy(x.device,s,e,ignoreId))continue;
   res.push({t:t.id,start:s,end:e,room:x.room||t.room,device:x.device||null});
  }
 }
 return res.sort((a,b)=>a.start-b.start||THERAPISTS.indexOf(TH[a.t])-THERAPISTS.indexOf(TH[b.t]));
}
// How a slot sits against the therapist's other bookings: minutes left free before and after it
function slotFit(sl,ignoreId){
 const t=TH[sl.t];
 const busy=APPTS.filter(a=>a.t===t.id&&live(a)&&a.id!==ignoreId).map(a=>[a.start,a.end]);
 if(t.ls!=null)busy.push([t.ls,t.le]);
 let prev=Math.max(t.s,Math.ceil(NOW/15)*15),next=t.e;
 busy.forEach(([s,e])=>{if(e<=sl.start&&e>prev)prev=e;if(s>=sl.end&&s<next)next=s});
 return{before:sl.start-prev,after:next-sl.end};
}
function checkConflicts(sl,tx,ignoreId){
 const x=TX[tx],t=TH[sl.t],out=[];
 if(x.skill&&!t.skills.includes(x.skill))out.push(t.first+' does not do '+SKILL_NAME[x.skill]);
 if(!works(t,sl.start,sl.end))out.push(t.first+' is not working '+fmt(sl.start)+'–'+fmt(sl.end));
 if(therapistBusy(t.id,sl.start,sl.end,ignoreId))out.push(t.first+' is already booked');
 if(x.room&&resourceBusy(x.room,sl.start,sl.end,ignoreId))out.push(ROOMS[x.room]+' is in use');
 if(x.device&&resourceBusy(x.device,sl.start,sl.end,ignoreId))out.push('Laser unit is in use');
 return out;
}

const TOD={any:[0,2000,'Any time'],morning:[0,720,'Before 12'],midday:[720,900,'12–15'],late:[900,2000,'After 15']};
function openFinder(pre={}){fd=Object.assign({patient:null,q:'',tx:'FU',who:'usual',only:null,tod:'any',pick:null,moveId:null,lock:null},pre);$('#finder').classList.add('open');setProto('b');renderAll();if(!fd.patient){const i=$('#fq');i&&i.focus()}}
function closeFinder(){fd=null;$('#finder').classList.remove('open');setProto('d');renderAll()}
function ranked(){
 const x=TX[fd.tx],p=fd.patient,w=p&&p.waitlist;
 let ths=null;if(fd.who==='only'&&fd.only)ths=[fd.only];
 const [a,b]=TOD[fd.tod];
 let s=findSlots({tx:fd.tx,therapists:ths,ignoreId:fd.moveId}).filter(s=>s.start>=a&&s.end<=b);
 if(fd.lock)s=s.filter(z=>z.t===fd.lock.t&&z.start>=fd.lock.start&&z.end<=fd.lock.end);
 return s.map(sl=>{
  const f=slotFit(sl,fd.moveId);let score=0;const why=[];
  if(f.before===0&&f.after===0){score+=4;why.push(['good','Fills a gap exactly'])}
  else if(f.before===0||f.after===0){score+=1.5;why.push(['good','No hole '+(f.before===0?'before':'after')])}
  const hb=f.before>0&&f.before<30,ha=f.after>0&&f.after<30;if(hb||ha){score-=3;why.push(['warn',`Leaves ${hb?f.before:f.after} min unusable ${hb?'before':'after'}`])}
  if(p&&p.usual===sl.t){score+=fd.who==='usual'?3:1;why.push(['good','Usual therapist'])}
  if(w){if((w.before&&sl.end>w.before)||(w.after&&sl.start<w.after)||(w.therapists&&!w.therapists.includes(sl.t))){score-=5;why.push(['warn','Outside what patient asked for'])}else if(w.before||w.after||w.therapists)why.push(['good','Matches request: '+w.note.toLowerCase()])}
  if(w&&w.notice&&sl.start<NOW+w.notice){score-=5;why.push(['warn','Less than '+w.notice+' min notice'])}
  if(x.needs)why.push(['res',x.needs+' free']);
  score-=(sl.start-NOW)/240;
  if(sl.start-NOW<30)why.push(['','Starts in '+(sl.start-NOW)+' min']);
  return{sl,score,why};
 }).sort((a,b)=>b.score-a.score);
}

 const d=el.dataset;
 if(d.p){fd.patient=PATIENTS.find(p=>p.name===d.p);if(fd.patient.waitlist)fd.tx=fd.patient.waitlist.tx;autoPick();return renderFinder()}
 if(d.newp){fd.patient={name:fd.q.replace(/\b\w/g,c=>c.toUpperCase()),phone:'—',usual:'TB',visits:0,balance:0};fd.who='any';fd.tx='ASM';autoPick();return renderAll()}
 if(d.tx){fd.tx=d.tx;if(fd.who==='only'&&TX[d.tx].skill&&!TH[fd.only].skills.includes(TX[d.tx].skill))fd.who='any';autoPick();return renderAll()}
 if(d.who){fd.who=d.who;fd.only=null;autoPick();return renderAll()}
 if(d.only){fd.who='only';fd.only=d.only;autoPick();return renderAll()}
 if(d.tod){fd.tod=d.tod;autoPick();return renderAll()}
 if(d.pick){const[t,s]=d.pick.split('|');fd.pick=findSlots({tx:fd.tx,therapists:[t],ignoreId:fd.moveId}).find(z=>z.start===+s);return renderAll()}
 if(d.do){const a=d.id&&APPTS.find(a=>a.id===+d.id);
  switch(d.do){
   case'in':a.status=a.start<=NOW?'intreat':'arrived';a.arrivedAt=NOW;toast(`${esc(a.patient.name)} checked in · ${TH[a.t].first} notified`);break;
   case'call':toast(`Calling ${esc(a.patient.name)} on ${a.patient.phone}…`);return;
   case'release':{const was={t:a.t,start:a.start,end:a.end};
    // a no-show frees the rest of the slot from now on
    a.status='cancelled';a.cancelledAt=fmt(NOW);a.cancelNote='No-show';a.patient.balance=(a.patient.balance||0)+TX[a.tx].price/2;
    const g=allGaps().find(g=>g.t===was.t&&g.start<was.end&&was.start<g.end);if(g)selGap=g.t+'|'+g.start;renderAll();
    if(g){const el=document.getElementById(`gap-${g.t}-${g.start}`);el&&el.scrollIntoView({block:'nearest'})}
    toast(g?`${TH[was.t].first} has ${g.end-g.start} min free from ${fmt(g.start)}. Matches are listed on the right.`:'Marked no-show. Too little time left to rebook.');return}
   case'pay':a.paid=true;a.patient.balance=0;toast(`${kr(TX[a.tx].price)} paid · receipt sent`);break;
   case'invoice':a.paid=true;toast(`Invoice sent to ${esc(a.patient.name)}`);break;
   case'rebook':openFinder({patient:a.patient,tx:a.tx,who:'usual'});autoPick();return renderAll();
   case'offer':offers[d.w]=fmt(NOW);toast(`Offer sent to ${esc(d.w)}. First to reply YES gets it.`);break;
   case'fill':{const[t,s]=d.gap.split('|');const g=allGaps().find(g=>g.t===t&&g.start===+s);const m=candidatesFor(g).find(m=>m.w.name===d.w);const p=PATIENTS.find(p=>p.name===d.w);
    openFinder({patient:p,tx:m.w.tx,who:'any',lock:g});fd.pick=findSlots({tx:m.w.tx,therapists:[t]}).find(z=>z.start===m.start);return renderAll()}
   case'findgap':{const[t,s]=d.gap.split('|');const g=allGaps().find(g=>g.t===t&&g.start===+s);openFinder({who:'only',only:t,lock:g,tx:'FU'});return}
   case'pclear':fd.patient=null;fd.q='';fd.pick=null;return renderAll();
   case'unlock':fd.lock=null;autoPick();return renderAll();
   case'close':return closeFinder();
   case'book':return doBook();
  }
  return renderAll();
 }
 if(d.gap){selGap=selGap===d.gap?null:d.gap;renderAll();const[t,s]=d.gap.split('|');const el=document.getElementById(`gap-${t}-${s}`);el&&el.scrollIntoView({block:'nearest',behavior:'smooth'});return}
});
document.addEventListener('keydown',e=>{
 const typing=/INPUT/.test(document.activeElement.tagName);
 if(e.key==='Escape'&&fd){closeFinder();return}
 if(fd&&e.key==='Enter'){if(document.activeElement.id==='fq'){const f=document.querySelector('.res-list div');if(f){f.click();e.preventDefault()}return}doBook();return}
 if(typing)return;
 if((e.key==='f'||e.key==='F')&&!fd){e.preventDefault();openFinder()}
});
$('#search').addEventListener('keydown',e=>{if(e.key==='Enter'){const r=searchPatients(e.target.value)[0];if(r){openFinder({patient:r,tx:r.waitlist?r.waitlist.tx:'FU'});autoPick();renderAll()}e.target.value='';e.target.blur()}});
function toast(m){const t=$('#toast');t.innerHTML=m;t.style.display='flex';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',4200)}
function setProto(s){$('#pDay').classList.toggle('on',s==='d');$('#pBook').classList.toggle('on',s==='b')}
function demo(){const p=PATIENTS.find(p=>p.name==='Erik Dahl');openFinder({patient:p,tx:p.waitlist.tx});autoPick();renderAll()}
$('#clock').textContent=fmt(NOW);$('#date').textContent=DATE_LABEL;
renderAll();
if(location.hash==='#booking')demo();
</script>
</body>
</html>
