<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Front Desk · Planner</title>
<style>
:root{
 --bg:#f3f4f6;--panel:#fff;--line:#e2e5ea;--line2:#f0f1f4;--ink:#1b2130;--ink2:#566074;--ink3:#8b93a3;
 --accent:#2d5bd2;--accent-soft:#e9eefc;--ok:#1d7f47;--ok-soft:#e3f3ea;--warn:#a96400;--warn-soft:#fff2d8;--bad:#c23434;--bad-soft:#fde9e9;
 --slot:18px;--gut:58px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:13px/1.35 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
kbd{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;background:#fff;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--ink2)}
.tn{font-variant-numeric:tabular-nums}

/* header */
header{height:52px;flex:none;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 16px}
.brand{font-weight:700;letter-spacing:-.01em;margin-right:6px}
.brand span{color:var(--ink3);font-weight:500}
.datenav{display:flex;align-items:center;gap:4px}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:6px;height:30px;min-width:30px;padding:0 8px}
.iconbtn:hover{background:var(--line2)}
.date{font-weight:600;padding:0 8px}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:#fff;padding:5px 11px;color:var(--ink2)}
.seg button.on{background:var(--ink);color:#fff}
.search{flex:1;max-width:340px;position:relative}
.search input{width:100%;height:32px;border:1px solid var(--line);border-radius:7px;padding:0 10px 0 30px;font:inherit;background:var(--bg)}
.search svg{position:absolute;left:9px;top:9px}
.search kbd{position:absolute;right:8px;top:7px}
.stats{display:flex;gap:16px;color:var(--ink2);margin-left:auto}
.stats b{color:var(--ink);font-weight:600}
.primary{background:var(--accent);color:#fff;border:0;border-radius:7px;height:32px;padding:0 14px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.primary:hover{background:#244bb3}
.primary kbd{background:rgba(255,255,255,.18);border-color:transparent;color:#fff}

/* layout */
main{flex:1;display:flex;min-height:0;position:relative}
.board{flex:1;overflow:auto;background:var(--panel);position:relative}
.rail{width:328px;flex:none;border-left:1px solid var(--line);background:var(--bg);overflow:auto;padding:12px}

/* grid */
.grid{display:grid;min-width:100%;position:relative}
.colhead{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);border-left:1px solid var(--line2);padding:7px 10px;height:50px}
.colhead .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.colhead .h{color:var(--ink3);font-size:12px;white-space:nowrap}
.colhead .h b{color:var(--ink2);font-weight:500}
.corner{position:sticky;top:0;left:0;z-index:6;background:var(--panel);border-bottom:1px solid var(--line)}
.gutter{position:sticky;left:0;z-index:4;background:var(--panel);border-right:1px solid var(--line)}
.gutter div{position:absolute;right:8px;font-size:11px;color:var(--ink3);transform:translateY(-7px)}
.gutter div.hr{color:var(--ink2);font-weight:600}
.col{position:relative;border-left:1px solid var(--line2)}
.col .ln{position:absolute;left:0;right:0;border-top:1px solid var(--line2)}
.col .ln.hr{border-top-color:var(--line)}
.off{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,#f5f6f8 0 6px,#eceef2 6px 7px);z-index:1}
.off span{position:absolute;left:8px;top:4px;font-size:11px;color:var(--ink3)}
.hover-slot{position:absolute;left:3px;right:3px;border:1.5px dashed var(--accent);border-radius:6px;background:rgba(45,91,210,.05);z-index:2;pointer-events:none;font-size:11px;color:var(--accent);padding:2px 6px;display:none}
.nowline{position:absolute;left:var(--gut);right:0;height:0;border-top:2px solid var(--bad);z-index:8;pointer-events:none}
.nowline span{position:absolute;left:-54px;top:-9px;background:var(--bad);color:#fff;font-size:11px;font-weight:600;padding:1px 5px;border-radius:4px}

.ap{position:absolute;left:3px;right:3px;border-radius:6px;padding:1px 7px 1px 9px;line-height:16px;overflow:hidden;z-index:3;border:1px solid var(--line);background:#fff;cursor:pointer;box-shadow:0 1px 0 rgba(20,30,50,.04)}
.ap::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.ap:hover{border-color:#b9c2d3}
.ap .l1{display:flex;gap:6px;align-items:baseline;white-space:nowrap}
.ap .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.ap .tm{font-size:11px;color:var(--ink3);flex:none}
.ap .l2{line-height:15px;font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:5px;align-items:center}
.chip{display:inline-block;font-size:10.5px;padding:0 5px;border-radius:4px;background:var(--line2);color:var(--ink2);font-weight:500;line-height:15px;flex:none}
.chip.res{background:#efe9fb;color:#5b3aa8}
.tag{margin-left:auto;font-size:10.5px;font-weight:600;padding:0 5px;border-radius:4px;line-height:15px;flex:none}
.ap.done{background:#f7f8fa;color:var(--ink3)}
.ap.done::before{background:#c9ced8}
.ap.done .nm{font-weight:500;color:var(--ink2)}
.ap.noshow{background:#f7f8fa}.ap.noshow .nm{text-decoration:line-through;color:var(--ink3)}
.ap.noshow::before{background:#c9ced8}
.ap.arrived{background:var(--ok-soft);border-color:#bfe1cc}
.ap.arrived::before{background:var(--ok)}
.ap.intreat{background:var(--accent-soft);border-color:#c8d5f6}
.ap.late{background:var(--bad-soft);border-color:#f0b9b9}
.ap.late::before{background:var(--bad)}
.ap.due::before{background:var(--warn)}
.ap.cancelled{background:repeating-linear-gradient(135deg,#fff 0 6px,#fbf3e3 6px 8px);border:1px dashed #e2c48a;box-shadow:none}
.ap.cancelled::before{display:none}
.ap.cancelled .nm{color:var(--warn);font-weight:500;text-decoration:line-through}
.ap.sel{outline:2px solid var(--ink);outline-offset:1px;z-index:6}
.ap.new{animation:pop 1.2s ease}
@keyframes pop{0%{box-shadow:0 0 0 6px rgba(45,91,210,.35)}100%{box-shadow:0 0 0 0 rgba(45,91,210,0)}}
.ap.ghost{background:var(--accent);border-color:var(--accent);color:#fff;z-index:7;box-shadow:0 6px 18px rgba(45,91,210,.35);pointer-events:none}
.ap.ghost::before{background:#fff}
.ap.ghost .tm,.ap.ghost .l2{color:#dfe7ff}
.ap.ghost.bad{background:var(--bad);border-color:var(--bad)}
.gap{position:absolute;left:3px;right:3px;border:1.5px dashed #e0a940;border-radius:6px;z-index:2;background:rgba(255,242,216,.55);padding:3px 8px;font-size:11.5px;color:var(--warn);cursor:pointer;display:flex;flex-direction:column;gap:1px}
.gap b{font-weight:600}
.gap:hover{background:var(--warn-soft)}

/* rail */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
.card h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);padding:10px 12px 6px;display:flex;align-items:center;gap:6px}
.card h3 .ct{background:var(--line2);color:var(--ink2);border-radius:9px;padding:0 7px;font-size:11px;letter-spacing:0}
.row{padding:8px 12px;border-top:1px solid var(--line2);display:flex;gap:10px;align-items:center}
.row .grow{flex:1;min-width:0}
.row .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{color:var(--ink2);font-size:12px}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 9px;font-size:12px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--line2)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.acc:hover{background:#244bb3}
.btn.warn{border-color:#e7c07a;background:var(--warn-soft);color:#7d4a00}
.btn.bad{color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.detail{padding:12px}
.detail .nm{font-size:16px;font-weight:700}
.detail dl{display:grid;grid-template-columns:86px 1fr;gap:4px 8px;margin:10px 0;font-size:12.5px}
.detail dt{color:var(--ink3)}
.detail dd{margin:0}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.actions .btn{padding:6px 10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:4px 12px 12px;color:var(--ink2);font-size:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* drawer */
.scrim{position:absolute;inset:0;background:rgba(20,26,40,.08);z-index:20;display:none}
.drawer{position:absolute;top:0;right:0;bottom:0;width:440px;background:var(--panel);border-left:1px solid var(--line);box-shadow:-12px 0 30px rgba(20,26,40,.12);z-index:21;display:none;flex-direction:column}
.open .drawer{display:flex}
.drawer .hd{padding:14px 18px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drawer .hd h2{margin:0;font-size:16px}
.drawer .hd .x{margin-left:auto}
.drawer .bd{flex:1;overflow:auto;padding:6px 18px 18px}
.drawer .ft{border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:8px;align-items:center;background:#fafbfc}
.fld{margin-top:14px}
.fld>label{display:flex;justify-content:space-between;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);font-weight:600;margin-bottom:6px}
.fld>label span{text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink3)}
.inp{width:100%;height:36px;border:1px solid var(--line);border-radius:7px;padding:0 10px;font:inherit;font-size:14px}
.inp:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.results{border:1px solid var(--line);border-radius:7px;margin-top:4px;overflow:hidden}
.results div{padding:7px 10px;display:flex;justify-content:space-between;cursor:pointer;border-top:1px solid var(--line2)}
.results div:first-child{border-top:0}
.results div:hover,.results div.on{background:var(--accent-soft)}
.results small{color:var(--ink3)}
.pcard{border:1px solid var(--line);border-radius:8px;padding:9px 11px;display:flex;gap:10px;align-items:center}
.pcard .grow{flex:1}
.pcard .t2{color:var(--ink2);font-size:12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.opt{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 9px;text-align:left;display:flex;flex-direction:column;gap:1px}
.opt small{color:var(--ink3);font-size:11.5px}
.opt:hover{border-color:#b9c2d3}
.opt.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt:disabled{opacity:.45;cursor:not-allowed;background:#fafafa}
.opts.th{grid-template-columns:repeat(3,1fr)}
.times{display:flex;flex-wrap:wrap;gap:5px}
.times button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 8px;font-size:12.5px}
.times button:hover{border-color:#b9c2d3}
.times button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.times button .w{font-size:10.5px;color:var(--ink3);margin-left:4px}
.times button.on .w{color:#dfe7ff}
.tgroup{margin-bottom:8px}
.tgroup .gl{font-size:12px;color:var(--ink2);margin-bottom:4px}
.summary{margin-top:16px;border-radius:8px;background:var(--bg);padding:10px 12px;font-size:13px}
.summary .big{font-weight:600;font-size:14px}
.check{font-size:12px;margin-top:6px;display:flex;flex-direction:column;gap:2px}
.check .ok{color:var(--ok)}.check .no{color:var(--bad)}
.empty{color:var(--ink3);font-size:12.5px;padding:6px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;display:none;gap:12px;align-items:center;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast button{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:5px;padding:3px 8px}
.proto{position:fixed;left:12px;bottom:12px;z-index:60;background:#111;color:#fff;border-radius:8px;padding:5px;display:flex;gap:4px;font-size:12px;opacity:.9}
.proto span{padding:4px 6px;color:#aaa}
.proto button{background:#333;border:0;color:#fff;border-radius:5px;padding:4px 9px}
.proto button.on{background:#fff;color:#111}
</style>
</head>
<body>
<header>
 <div class="brand">Fysio Nord <span>front desk</span></div>
 <div class="datenav"><button class="iconbtn" title="Previous day">&#8249;</button><button class="iconbtn">Today</button><button class="iconbtn" title="Next day">&#8250;</button><div class="date" id="date"></div></div>
 <div class="seg" id="viewSeg"><button class="on" data-v="t">Therapists</button><button data-v="r">Rooms &amp; machines</button></div>
 <div class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8b93a3" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="find" placeholder="Find patient or phone"><kbd>/</kbd></div>
 <div class="stats tn" id="stats"></div>
 <button class="primary" id="newBtn">New booking <kbd>N</kbd></button>
</header>
<main id="main">
 <div class="board" id="board"><div class="grid" id="grid"></div></div>
 <aside class="rail" id="rail"></aside>
 <div class="scrim" id="scrim"></div>
 <div class="drawer" id="drawer"></div>
</main>
<div class="toast" id="toast"></div>
<div class="proto"><span>Prototype</span><button id="pDay" class="on">Day view</button><button id="pBook">Booking</button></div>
<script>
// ---------- Mock data (same in all three directions) ----------
const pad=n=>String(n).padStart(2,'0');
const toMin=s=>{const[a,b]=s.split(':').map(Number);return a*60+b};
const fmt=n=>pad(Math.floor(n/60))+':'+pad(n%60);
const NOW=toMin('10:40');
const DAY_START=toMin('07:30'), DAY_END=toMin('19:30');
const DATE_LABEL='Saturday 26 September';
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(20260926);

const THERAPISTS=[
 {id:'IS',name:'Ingrid Solberg',first:'Ingrid',start:'07:30',end:'16:00',room:'R1',skills:['SW','GYM']},
 {id:'MR',name:'Marco Rossi',first:'Marco',start:'07:30',end:'14:00',room:'R2',skills:['LZ']},
 {id:'TB',name:'Tom Bakke',first:'Tom',start:'08:00',end:'17:30',room:'R5',skills:['SW','GYM'],lunch:['12:00','12:30']},
 {id:'JB',name:'Jonas Berg',first:'Jonas',start:'08:00',end:'16:00',room:'R6',skills:['GYM'],lunch:['12:30','13:00']},
 {id:'PN',name:'Priya Nair',first:'Priya',start:'09:30',end:'19:00',room:'R4',skills:['SW','LZ'],lunch:['14:00','14:30']},
 {id:'AL',name:'Ane Lund',first:'Ane',start:'11:30',end:'19:30',room:'R7',skills:['LZ','SW']},
];
THERAPISTS.forEach(t=>{t.s=toMin(t.start);t.e=toMin(t.end);t.ls=t.lunch?toMin(t.lunch[0]):null;t.le=t.lunch?toMin(t.lunch[1]):null;});
const TH=Object.fromEntries(THERAPISTS.map(t=>[t.id,t]));
const ROOMS={R1:'Room 1',R2:'Room 2',R3:'Room 3',R4:'Room 4',R5:'Room 5',R6:'Room 6',R7:'Room 7',GYM:'Gym',LASER:'Laser unit'};
const TREATMENTS=[
 {id:'FU',code:'fu',name:'Follow-up',dur:30,price:650,w:50},
 {id:'ASM',code:'as',name:'Initial assessment',dur:45,price:950,w:10},
 {id:'SM',code:'sm',name:'Sports massage',dur:45,price:750,w:9},
 {id:'DN',code:'dn',name:'Dry needling',dur:30,price:650,w:12},
 {id:'SW',code:'sw',name:'Shockwave',dur:30,price:850,w:10,skill:'SW',room:'R3',needs:'Room 3 (shockwave unit)'},
 {id:'GYM',code:'gy',name:'Rehab gym',dur:45,price:700,w:8,skill:'GYM',room:'GYM',needs:'Gym'},
 {id:'LZ',code:'lz',name:'Laser therapy',dur:30,price:600,w:6,skill:'LZ',device:'LASER',needs:'Laser unit'},
];
const TX=Object.fromEntries(TREATMENTS.map(t=>[t.id,t]));
const SKILL_NAME={SW:'shockwave',GYM:'gym',LZ:'laser'};

const FIRST=['Kari','Erik','Sofie','Lars','Nora','Henrik','Ingrid','Ola','Mia','Jonas','Emma','Jakob','Sara','Magnus','Ida','Filip','Thea','Anders','Julie','Mats','Hanne','Per','Silje','Aksel','Maja','Trond','Linnea','Oskar','Vilde','Eirik','Hedda','Sander','Tuva','Marius','Frida','Kristian','Amalie','Sindre','Ella','Geir','Leah','Omar','Ali','Anna','Petter','Rune'];
const LAST=['Hansen','Dahl','Brekke','Moen','Vik','Aas','Johansen','Larsen','Olsen','Eide','Haugen','Berg','Strand','Lie','Nilsen','Bakken','Solheim','Nygaard','Lunde','Holm','Kristiansen','Andersen','Pedersen','Aune','Rønning','Sæther','Myhre','Tveit','Foss','Hovland','Ali','Karim','Novak'];
const usedNames=new Set(['Kari Hansen','Erik Dahl','Sofie Brekke','Lars Moen','Nora Vik','Henrik Aas']);
const PATIENTS=[];
function phone(){return '9'+Math.floor(R()*10)+Math.floor(R()*10)+' '+pad(Math.floor(R()*100))+' '+String(Math.floor(R()*1000)).padStart(3,'0')}
function newPatient(){
 let n;do{n=FIRST[Math.floor(R()*FIRST.length)]+' '+LAST[Math.floor(R()*LAST.length)]}while(usedNames.has(n));
 usedNames.add(n);
 const p={name:n,phone:phone(),usual:THERAPISTS[Math.floor(R()*THERAPISTS.length)].id,visits:1+Math.floor(R()*14),balance:R()<0.08?650:0};
 PATIENTS.push(p);return p;
}

const APPTS=[];let nid=1;
function live(a){return a.status!=='cancelled'}
function resourceBusy(res,s,e,ignoreId){return APPTS.some(a=>a.id!==ignoreId&&live(a)&&(a.room===res||a.device===res)&&a.start<e&&s<a.end)}
function therapistBusy(tid,s,e,ignoreId){return APPTS.some(a=>a.id!==ignoreId&&live(a)&&a.t===tid&&a.start<e&&s<a.end)}
function works(t,s,e){return s>=t.s&&e<=t.e&&!(t.ls!=null&&s<t.le&&t.ls<e)}
function pickTx(){let x=R()*100,acc=0;for(const t of TREATMENTS){acc+=t.w;if(x<acc)return t}return TREATMENTS[0]}

(function generate(){
 const cur=Object.fromEntries(THERAPISTS.map(t=>[t.id,t.s]));
 let active=[...THERAPISTS];
 while(active.length){
  active.sort((a,b)=>cur[a.id]-cur[b.id]);
  const t=active[0];const c=cur[t.id];
  if(c>=t.e){active.shift();continue}
  if(t.ls!=null&&c>=t.ls&&c<t.le){cur[t.id]=t.le;continue}
  if(R()<0.045){cur[t.id]=c+(R()<0.6?15:30);continue}
  const ok=x=>{const e=c+x.dur;if(!works(t,c,e))return false;if(x.skill&&!t.skills.includes(x.skill))return false;if(x.room&&resourceBusy(x.room,c,e))return false;if(x.device&&resourceBusy(x.device,c,e))return false;return true};
  let x=pickTx();if(!ok(x))x=TX.FU;
  if(!ok(x)){cur[t.id]=c+15;continue}
  APPTS.push({id:nid++,t:t.id,start:c,end:c+x.dur,tx:x.id,patient:newPatient(),room:x.room||t.room,device:x.device||null,status:'booked',paid:false});
  cur[t.id]=c+x.dur;
 }
 APPTS.sort((a,b)=>a.start-b.start||THERAPISTS.indexOf(TH[a.t])-THERAPISTS.indexOf(TH[b.t]));
 APPTS.forEach(a=>{
  if(a.end<=NOW){a.status=R()<0.05?'noshow':'done';a.paid=a.status==='done'&&R()<0.85;a.arrivedAt=a.start-Math.floor(R()*10)}
  else if(a.start<=NOW){a.status='intreat';a.arrivedAt=a.start-Math.floor(R()*8)}
  else if(a.start-NOW<=20){if(R()<0.6){a.status='arrived';a.arrivedAt=NOW-Math.floor(R()*9)}}
 });
 // Late patients: started in the last 15 minutes but not here
 APPTS.filter(a=>a.start<NOW&&a.start>=NOW-15).slice(0,2).forEach(a=>{a.status='late';delete a.arrivedAt});
 // Cancellations this morning free up time later today
 const fut=APPTS.filter(a=>a.start>NOW+45&&a.status==='booked');
 const sw=fut.find(a=>a.tx==='SW'&&a.start<toMin('15:00'));
 const toCancel=[sw,fut.filter(a=>a.tx!=='SW'&&a.start<toMin('13:00'))[2],fut.filter(a=>a.tx!=='SW'&&a.start>toMin('15:00'))[4]].filter(Boolean);
 const times=['08:52','09:31','10:18'];

function gapsFor(t,from=NOW,min=30){
 const busy=APPTS.filter(a=>a.t===t.id&&live(a)).map(a=>[a.start,a.end]);
 if(t.ls!=null)busy.push([t.ls,t.le]);
 busy.sort((a,b)=>a[0]-b[0]);
 const out=[];let c=Math.max(t.s,Math.ceil(from/15)*15);
 for(const[s,e]of busy){if(e<=c)continue;if(s>c&&s-c>=min)out.push({t:t.id,start:c,end:s});c=Math.max(c,e)}
 if(t.e-c>=min)out.push({t:t.id,start:c,end:t.e});
 out.forEach(g=>{g.freedBy=APPTS.find(a=>a.status==='cancelled'&&a.t===t.id&&a.start<g.end&&g.start<a.end)});

}

function findSlots({tx,therapists,from=NOW,to=DAY_END,ignoreId}){
 const x=TX[tx];const res=[];
 for(const t of THERAPISTS){
  if(therapists&&therapists.length&&!therapists.includes(t.id))continue;
  if(x.skill&&!t.skills.includes(x.skill))continue;
  for(let s=Math.max(t.s,Math.ceil(from/15)*15);s+x.dur<=Math.min(t.e,to);s+=15){
   const e=s+x.dur;
   if(!works(t,s,e)||therapistBusy(t.id,s,e,ignoreId))continue;
   if(x.room&&resourceBusy(x.room,s,e,ignoreId))continue;
   if(x.device&&resourceBusy(x.device,s,e,ignoreId))continue;
   res.push({t:t.id,start:s,end:e,room:x.room||t.room,device:x.device||null});

function slotFit(sl,ignoreId){
 const t=TH[sl.t];
 const busy=APPTS.filter(a=>a.t===t.id&&live(a)&&a.id!==ignoreId).map(a=>[a.start,a.end]);
 if(t.ls!=null)busy.push([t.ls,t.le]);
 let prev=Math.max(t.s,Math.ceil(NOW/15)*15),next=t.e;
 busy.forEach(([s,e])=>{if(e<=sl.start&&e>prev)prev=e;if(s>=sl.end&&s<next)next=s});

}

  if(!slots.length)h+=`<div class="empty">No free ${x.dur}-min slot today${bk.t?' with '+TH[bk.t].first:''}${x.needs?' where '+x.needs+' is free':''}. Next free: Monday 28 Sep.</div>`;
  const groups={};slots.forEach(s=>(groups[s.t]=groups[s.t]||[]).push(s));
  Object.keys(groups).forEach(tid=>{h+=`<div class="tgroup">${bk.t?'':`<div class="gl">${TH[tid].name}</div>`}<div class="times tn">${groups[tid].map(s=>{const f=slotFit(s,bk.moveId);const snug=f.before===0&&f.after===0;return `<button data-slot="${s.t}|${s.start}" class="${bk.t===s.t&&bk.start===s.start?'on':''}" title="${snug?'Fills a gap exactly':''}">${fmt(s.start)}${snug?'<span class="w">fits gap</span>':''}</button>`}).join('')}</div></div>`});
 }
 h+=`</div>`;
 // summary
 if(x&&bk.t&&bk.start!=null){
  const sl={t:bk.t,start:bk.start,end:bk.start+x.dur};const c=checkConflicts(sl,x.id,bk.moveId);
  const room=x.room||TH[bk.t].room;
  h+=`<div class="summary"><div class="big tn">${fmt(sl.start)}–${fmt(sl.end)} with ${TH[bk.t].name}</div><div style="color:var(--ink2)">${x.name} · ${ROOMS[room]}${x.device?' + laser unit':''} · ${kr(x.price)}</div><div class="check">${c.length?c.map(m=>`<span class="no">&#10007; ${m}</span>`).join(''):`<span class="ok">&#10003; ${TH[bk.t].first} free &nbsp; &#10003; ${ROOMS[room]} free${x.device?' &nbsp; &#10003; Laser unit free':''}</span>`}</div></div>`;
 }
 h+=`</div>`;
 const ready=bk.patient&&x&&bk.t&&bk.start!=null&&!checkConflicts({t:bk.t,start:bk.start,end:bk.start+x.dur},x.id,bk.moveId).length;
 h+=`<div class="ft"><button class="primary" id="bkGo" ${ready?'':'disabled style="opacity:.5;cursor:not-allowed"'}>${bk.moveId?'Move':'Book'} <kbd>Enter</kbd></button><label style="display:flex;gap:6px;align-items:center;color:var(--ink2)"><input type="checkbox" checked> Send SMS confirmation</label></div>`;
 const hadFocus=document.activeElement&&document.activeElement.id==='pq';const pos=hadFocus?document.activeElement.selectionStart:0;
 d.innerHTML=h;
 if(hadFocus){const i=$('#pq');if(i){i.focus();i.setSelectionRange(pos,pos)}}
}
function doBook(){
 const x=TX[bk.tx];if(!(bk.patient&&x&&bk.t&&bk.start!=null))return;
 if(checkConflicts({t:bk.t,start:bk.start,end:bk.start+x.dur},x.id,bk.moveId).length)return;
 const a=book({patient:bk.patient,tx:bk.tx,t:bk.t,start:bk.start},bk.moveId);
 const moved=!!bk.moveId;selId=a.id;closeBooking();
 toast(`${moved?'Moved':'Booked'} ${esc(a.patient.name)} · ${fmt(a.start)} with ${TH[a.t].first}. SMS sent.`);
 scrollToMin(a.start);
}
document.addEventListener('input',e=>{if(e.target.id==='pq'){bk.q=e.target.value;renderDrawer()}});
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-p],[data-tx],[data-t],[data-slot],#pClear,#pNew,#bkClose,#bkGo,[data-act],[data-sel],[data-checkin],[data-pay],[data-fill],[data-wait],.ap,.gap,#newBtn,#viewSeg button,#pDay,#pBook');
 if(!el){return}
 if(el.id==='pDay'){if(bk)closeBooking();return}
 if(el.id==='pBook'){if(!bk)demoBooking();return}
 if(el.id==='newBtn')return openBooking();
 if(el.id==='bkClose')return closeBooking();
 if(el.id==='bkGo')return doBook();
 if(el.id==='pClear'){bk.patient=null;bk.q='';return renderAll()}
 if(el.id==='pNew'){e.preventDefault();bk.patient={name:bk.q.replace(/\b\w/g,c=>c.toUpperCase()),phone:'—',usual:'TB',visits:0,balance:0};return renderAll()}
 if(el.matches('#viewSeg button')){view=el.dataset.v;document.querySelectorAll('#viewSeg button').forEach(b=>b.classList.toggle('on',b===el));return renderGrid()}
 if(el.dataset.p){bk.patient=PATIENTS.find(p=>p.name===el.dataset.p);if(!bk.tx&&bk.patient.waitlist)bk.tx=bk.patient.waitlist.tx;return renderAll()}
 if(el.dataset.tx){bk.tx=el.dataset.tx;if(bk.t&&bk.start!=null&&checkConflicts({t:bk.t,start:bk.start,end:bk.start+TX[bk.tx].dur},bk.tx,bk.moveId).length){const s=findSlots({tx:bk.tx,therapists:[bk.t],from:bk.start,ignoreId:bk.moveId})[0];bk.start=s?s.start:null}return renderAll()}
 if(el.dataset.t){bk.t=bk.t===el.dataset.t?null:el.dataset.t;bk.start=null;if(bk.t&&bk.tx){const s=findSlots({tx:bk.tx,therapists:[bk.t],ignoreId:bk.moveId})[0];if(s)bk.start=s.start}return renderAll()}
 if(el.dataset.slot){const[t,s]=el.dataset.slot.split('|');bk.t=t;bk.start=+s;renderAll();return scrollToMin(+s)}
 if(el.dataset.act){const a=APPTS.find(a=>a.id===selId);const k=el.dataset.act;
  if(k==='close'){selId=null;return renderAll()}
  return act(a,k)}
 if(el.dataset.sel){selId=+el.dataset.sel;renderAll();return scrollToMin(APPTS.find(a=>a.id===selId).start)}
 if(el.dataset.checkin)return act(APPTS.find(a=>a.id===+el.dataset.checkin),'checkin');
 if(el.dataset.pay)return act(APPTS.find(a=>a.id===+el.dataset.pay),'pay');
 if(el.dataset.fill||el.dataset.gap){const[t,s]=(el.dataset.fill||el.dataset.gap).split('|');const g=allGaps().find(g=>g.t===t&&g.start===+s);const c=candidatesFor(g)[0];
  scrollToMin(g.start);
  if(c)return openBooking({patient:PATIENTS.find(p=>p.name===c.w.name),tx:c.w.tx,t,start:c.start});
  return openBooking({t,start:g.start,tx:'FU'})}
 if(el.dataset.wait){const w=WAITLIST[+el.dataset.wait];return openBooking({patient:PATIENTS.find(p=>p.name===w.name),tx:w.tx})}
 if(el.classList.contains('ap')&&!el.classList.contains('ghost')){if(bk)return;selId=+el.dataset.id;return renderAll()}
});
// click on empty grid space = book there
$('#grid').addEventListener('click',e=>{
 if(e.target.closest('.ap,.gap'))return;const col=e.target.closest('.col');if(!col||view!=='t')return;
 const t=TH[col.dataset.col];const r=col.getBoundingClientRect();const m=DAY_START+Math.floor((e.clientY-r.top)/SLOT)*15;
 if(!works(t,m,m+15)){toast(`${t.first} is not working at ${fmt(m)}`);return}
 if(therapistBusy(t.id,m,m+15))return;
 if(bk){bk.t=t.id;bk.start=m;if(!bk.tx)bk.tx='FU';return renderAll()}
 openBooking({t:t.id,start:m,tx:'FU'});
});
$('#grid').addEventListener('mousemove',e=>{
 document.querySelectorAll('.hover-slot').forEach(h=>h.style.display='none');
 if(e.target.closest('.ap,.gap,.off'))return;const col=e.target.closest('.col');if(!col||view!=='t')return;
 const r=col.getBoundingClientRect();const m=DAY_START+Math.floor((e.clientY-r.top)/SLOT)*15;const hs=col.querySelector('.hover-slot');
 const t=TH[col.dataset.col];if(!works(t,m,m+15)||therapistBusy(t.id,m,m+15))return;
 hs.style.display='block';hs.style.top=y(m)+1+'px';hs.style.height=SLOT*2-2+'px';hs.textContent=fmt(m)+' · book';
});
$('#grid').addEventListener('mouseleave',()=>document.querySelectorAll('.hover-slot').forEach(h=>h.style.display='none'));
function act(a,k){
 if(!a)return;
 if(k==='checkin'){a.status=a.start<=NOW?'intreat':'arrived';a.arrivedAt=NOW;toast(`${esc(a.patient.name)} checked in. ${TH[a.t].first} notified.`)}
 if(k==='pay'){a.paid=true;toast(`${kr(TX[a.tx].price)} taken by card from ${esc(a.patient.name)}.`)}
 if(k==='noshow'){a.status='noshow';toast(`Marked no-show. Fee rule applies.`)}
 if(k==='cancel'){a.status='cancelled';a.cancelledAt=fmt(NOW);a.cancelNote='By desk';selId=null;const g=allGaps().find(g=>g.t===a.t&&g.start<a.end&&a.start<g.end);const n=g?candidatesFor(g).length:0;
  renderAll();return toast(`Cancelled. ${n?n+' waitlist patients fit the gap.':'Gap is open.'}`,g&&n?{label:'Fill gap',fn:()=>{const c=candidatesFor(g)[0];openBooking({patient:PATIENTS.find(p=>p.name===c.w.name),tx:c.w.tx,t:g.t,start:c.start})}}:null)}
 if(k==='move'){return openBooking({patient:a.patient,tx:a.tx,t:a.t,start:null,moveId:a.id})}
 renderAll();
}
function toast(msg,action){const t=$('#toast');t.innerHTML=`<span>${msg}</span>`+(action?`<button id="tAct">${action.label}</button>`:'');t.style.display='flex';
 if(action)$('#tAct').onclick=()=>{t.style.display='none';action.fn()};clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',action?7000:3500)}
function scrollToMin(m){$('#board').scrollTop=Math.max(0,y(m)-160)}
document.addEventListener('keydown',e=>{
 const typing=/INPUT|TEXTAREA/.test(document.activeElement.tagName);
 if(e.key==='Escape'){if(bk)closeBooking();else{selId=null;renderAll()}return}
 if(bk&&e.key==='Enter'){if(document.activeElement.id==='pq'){const f=document.querySelector('.results div.on');if(f){f.click();e.preventDefault();return}}doBook();return}
 if(typing)return;
 const a=APPTS.find(a=>a.id===selId);
 if(e.key==='n'||e.key==='N'){e.preventDefault();openBooking()}
 else if(e.key==='/'){e.preventDefault();$('#find').focus()}
 else if(a&&(e.key==='c'||e.key==='C'))act(a,'checkin');
 else if(a&&(e.key==='p'||e.key==='P'))act(a,'pay');
 else if(a&&(e.key==='m'||e.key==='M'))act(a,'move');
 else if(a&&(e.key==='x'||e.key==='X'))act(a,'cancel');
});
$('#find').addEventListener('input',e=>{const r=searchPatients(e.target.value);const a=r.length&&APPTS.find(a=>a.patient.name===r[0].name&&live(a));if(a){selId=a.id;renderAll();scrollToMin(a.start)}});
$('#find').addEventListener('keydown',e=>{if(e.key==='Enter'){const r=searchPatients(e.target.value);if(r[0]&&!APPTS.some(a=>a.patient.name===r[0].name&&live(a))){openBooking({patient:r[0],tx:r[0].waitlist?r[0].waitlist.tx:null})}e.target.blur()}});
function setProto(s){$('#pDay').classList.toggle('on',s==='d');$('#pBook').classList.toggle('on',s==='b')}
function demoBooking(){const g=allGaps()[0];const c=g&&candidatesFor(g)[0];if(c)openBooking({patient:PATIENTS.find(p=>p.name===c.w.name),tx:c.w.tx,t:g.t,start:c.start});else openBooking();scrollToMin(g?g.start:NOW)}
$('#date').textContent=DATE_LABEL;
renderAll();
setTimeout(()=>{scrollToMin(NOW-30);if(location.hash==='#booking')demoBooking();if(location.hash==='#rooms')document.querySelector('#viewSeg [data-v=r]').click()},50);
</script>
</body>
</html>
