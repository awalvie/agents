<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direction 1 - Aisle checklist</title>
<style>
  :root {
    --bg: #eef0ec;
    --phone: #ffffff;
    --ink: #1c211d;
    --muted: #5d665f;
    --line: #dde2dc;
    --accent: #1f7a4d;
    --accent-ink: #ffffff;
    --soft: #e7f3ec;
    --warn: #fff4d6;
    --warn-ink: #6b4d00;
    --done: #9aa39c;
    --anna: #c2410c;
    --tom: #1d4ed8;
    --mum: #7e22ce;
    --you: #1f7a4d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header.page { max-width: 1100px; margin: 0 auto; padding: 32px 16px 8px; }
  header.page h1 { margin: 0 0 6px; font-size: 24px; }
  header.page p { margin: 0; color: var(--muted); max-width: 70ch; line-height: 1.5; }
  .screens { display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; padding: 24px 16px 48px; }
  figure { margin: 0; }
  figcaption { font-size: 14px; color: var(--muted); margin: 0 0 10px 4px; font-weight: 600; }
  .phone {
    width: 360px; max-width: calc(100vw - 32px); height: 760px; background: var(--phone);
    border-radius: 36px; border: 10px solid #111; overflow: hidden; position: relative;
    display: flex; flex-direction: column; box-shadow: 0 20px 40px rgba(0,0,0,.15);
  }
  .status { height: 28px; font-size: 12px; display: flex; justify-content: space-between; padding: 6px 18px 0; color: var(--muted); flex: none; }

  /* List screen */
  .top { padding: 8px 18px 12px; border-bottom: 1px solid var(--line); flex: none; }
  .top .title { display: flex; justify-content: space-between; align-items: baseline; }
  .top h2 { margin: 0; font-size: 24px; }
  .left { font-size: 18px; font-weight: 700; color: var(--accent); }
  .presence {
    margin-top: 10px; background: var(--warn); color: var(--warn-ink); border-radius: 12px;
    padding: 10px 12px; font-size: 15px; line-height: 1.35; display: flex; gap: 10px; align-items: center;
  }
  .scroll { flex: 1; overflow-y: auto; padding-bottom: 110px; }
  .section { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); padding: 16px 18px 6px; }
  .row {
    display: flex; align-items: center; gap: 14px; min-height: 68px; padding: 8px 18px;
    border-bottom: 1px solid var(--line); cursor: pointer; user-select: none;
  }
  .box {
    width: 34px; height: 34px; border-radius: 10px; border: 3px solid var(--accent); flex: none;
    display: grid; place-items: center; font-size: 20px; color: var(--accent-ink); font-weight: 800;
  }
  .row .text { flex: 1; min-width: 0; }
  .name { font-size: 20px; font-weight: 600; }
  .note { font-size: 15px; color: var(--muted); margin-top: 2px; }
  .who {
    width: 34px; height: 34px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 15px;
    display: grid; place-items: center; flex: none;
  }
  .row.done .box { background: var(--done); border-color: var(--done); }
  .row.done .name { text-decoration: line-through; color: var(--done); }
  .row.done .note { color: var(--done); }
  .row.other .box { background: var(--anna); border-color: var(--anna); }
  .row.other .name { text-decoration: line-through; color: var(--done); }
  .row.other .note { color: var(--anna); font-weight: 600; }
  .row.mine .box { background: var(--accent); }
  .row.mine .name { text-decoration: line-through; color: var(--done); }
  .row.mine .note { color: var(--accent); font-weight: 600; }
  .fab {
    position: absolute; left: 18px; right: 18px; bottom: 22px; height: 64px; border: 0;
    border-radius: 18px; background: var(--accent); color: var(--accent-ink); font-size: 20px;
    font-weight: 700; box-shadow: 0 6px 16px rgba(31,122,77,.35);
  }

  /* Add screen */
  .add-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 18px; flex: none; }
  .add-head button { background: none; border: 0; font-size: 18px; color: var(--accent); padding: 10px 0; }
  .add-head h2 { font-size: 20px; margin: 0; }
  .field { margin: 6px 18px 0; }
  .field label { display: block; font-size: 15px; font-weight: 600; margin-bottom: 6px; color: var(--muted); }
  .input {
    width: 100%; font-size: 22px; padding: 14px 16px; border: 3px solid var(--accent);
    border-radius: 14px; background: #fff; color: var(--ink); font-family: inherit;
  }
  .input.small { font-size: 18px; border-width: 2px; border-color: var(--line); }
  .dupe {
    margin: 12px 18px 0; background: var(--warn); color: var(--warn-ink); border-radius: 14px; padding: 12px 14px;
    font-size: 16px; line-height: 1.4;
  }
  .dupe b { color: var(--ink); }
  .dupe .acts { display: flex; gap: 8px; margin-top: 10px; }
  .dupe .acts button { flex: 1; font-size: 16px; padding: 10px; border-radius: 10px; border: 2px solid var(--warn-ink); background: #fff; color: var(--warn-ink); font-weight: 600; }
  .sugg-title { font-size: 15px; font-weight: 600; color: var(--muted); margin: 18px 18px 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 18px; }
  .chip { font-size: 17px; padding: 10px 14px; border-radius: 999px; background: var(--soft); color: var(--accent); border: 0; font-weight: 600; }
  .save {
    margin: 18px 18px 0; height: 60px; border-radius: 16px; border: 0; background: var(--accent);
    color: #fff; font-size: 20px; font-weight: 700;
  }
  .keyboard { margin-top: auto; background: #d4d7dc; padding: 8px 4px 22px; flex: none; }
  .krow { display: flex; justify-content: center; gap: 5px; margin: 6px 0; }
  .k { background: #fff; border-radius: 6px; width: 29px; height: 40px; display: grid; place-items: center; font-size: 17px; box-shadow: 0 1px 0 #999; }
  .k.wide { width: 170px; }
  .k.mid { width: 60px; font-size: 13px; background: #b8bcc3; }
</style>
</head>
<body>
<header class="page">
  <h1>Direction 1: Aisle checklist</h1>
  <p>One familiar checklist, sorted by the part of the store. Big rows, the name of the person who asked on every item, and a live note when someone else takes an item. Tap a row on the list to tick it.</p>
</header>

<div class="screens">
  <figure>
    <figcaption>The list, while Anna also shops</figcaption>
    <div class="phone">
      <div class="status"><span>10:42</span><span>Home list</span></div>
      <div class="top">
        <div class="title"><h2>Shopping</h2><span class="left" id="left">7 left</span></div>
        <div class="presence">
          <span class="who" style="background:var(--anna)">A</span>
          <span>Anna is shopping too. What she takes shows here straight away.</span>
        </div>
      </div>
      <div class="scroll" id="list">
        <div class="section">Fruit and veg</div>
        <div class="row" data-note="Asked by Mum"><span class="box"></span><div class="text"><div class="name">Bananas</div><div class="note">Asked by Mum</div></div><span class="who" style="background:var(--mum)">M</span></div>
        <div class="row other"><span class="box">A</span><div class="text"><div class="name">Onions</div><div class="note">Anna took this, 2 min ago</div></div><span class="who" style="background:var(--tom)">T</span></div>
        <div class="row" data-note="Asked by Tom"><span class="box"></span><div class="text"><div class="name">Lemons x2</div><div class="note">Asked by Tom</div></div><span class="who" style="background:var(--tom)">T</span></div>
        <div class="section">Dairy</div>
        <div class="row" data-note="Tom: the mature cheddar, red pack"><span class="box"></span><div class="text"><div class="name">Cheese</div><div class="note">Tom: the mature cheddar, red pack</div></div><span class="who" style="background:var(--tom)">T</span></div>
        <div class="row" data-note="Asked by you"><span class="box"></span><div class="text"><div class="name">Milk</div><div class="note">Asked by you</div></div><span class="who" style="background:var(--you)">Y</span></div>
        <div class="row" data-note="Mum: plain, large pot"><span class="box"></span><div class="text"><div class="name">Yoghurt</div><div class="note">Mum: plain, large pot</div></div><span class="who" style="background:var(--mum)">M</span></div>
        <div class="section">Bakery</div>
        <div class="row" data-note="Asked by Anna"><span class="box"></span><div class="text"><div class="name">Bread</div><div class="note">Asked by Anna</div></div><span class="who" style="background:var(--anna)">A</span></div>
        <div class="section">Household</div>
        <div class="row" data-note="Asked by Mum"><span class="box"></span><div class="text"><div class="name">Washing-up liquid</div><div class="note">Asked by Mum</div></div><span class="who" style="background:var(--mum)">M</span></div>
        <div class="section">In the trolley</div>
        <div class="row done"><span class="box">&#10003;</span><div class="text"><div class="name">Eggs</div><div class="note">You, 10:31</div></div><span class="who" style="background:var(--you)">Y</span></div>
      </div>
      <button class="fab">+ Add item</button>
    </div>
  </figure>

  <figure>
    <figcaption>Adding an item, with a duplicate check</figcaption>
    <div class="phone">
      <div class="status"><span>18:05</span><span>Home list</span></div>
      <div class="add-head"><button>Cancel</button><h2>Add item</h2><span style="width:52px"></span></div>
      <div class="field">
        <label for="item">What do we need?</label>
        <input class="input" id="item" value="chee" autocomplete="off">
      </div>
      <div class="dupe">
        <b>Cheese</b> is already on the list. Tom asked for it on Tuesday: "the mature cheddar, red pack".
        <div class="acts"><button>Add a note to it</button><button>Add another</button></div>
      </div>
      <div class="field" style="margin-top:14px">
        <label for="note">Note (optional)</label>
        <input class="input small" id="note" placeholder="Brand, size, how many">
      </div>
      <div class="sugg-title">You often buy</div>
      <div class="chips">
        <button class="chip">+ Cheese slices</button>
        <button class="chip">+ Cream cheese</button>
        <button class="chip">+ Chickpeas</button>
      </div>
      <button class="save">Add to list</button>
      <div class="keyboard" aria-hidden="true">
        <div class="krow"><span class="k">q</span><span class="k">w</span><span class="k">e</span><span class="k">r</span><span class="k">t</span><span class="k">y</span><span class="k">u</span><span class="k">i</span><span class="k">o</span><span class="k">p</span></div>
        <div class="krow"><span class="k">a</span><span class="k">s</span><span class="k">d</span><span class="k">f</span><span class="k">g</span><span class="k">h</span><span class="k">j</span><span class="k">k</span><span class="k">l</span></div>
        <div class="krow"><span class="k">z</span><span class="k">x</span><span class="k">c</span><span class="k">v</span><span class="k">b</span><span class="k">n</span><span class="k">m</span></div>
        <div class="krow"><span class="k mid">123</span><span class="k wide">space</span><span class="k mid">done</span></div>
      </div>
    </div>
  </figure>
</div>

<script>
  const list = document.getElementById('list');
  const left = document.getElementById('left');
  function count() {
    const n = list.querySelectorAll('.row:not(.done):not(.other):not(.mine)').length;
    left.textContent = n + ' left';
  }
  list.addEventListener('click', e => {
    const row = e.target.closest('.row');
    if (!row || row.classList.contains('other') || row.classList.contains('done')) return;
    const box = row.querySelector('.box');
    const note = row.querySelector('.note');
    if (row.classList.toggle('mine')) {
      box.innerHTML = '&#10003;';
      note.textContent = 'In your trolley. Tap to undo';
    } else {
      box.textContent = '';
      note.textContent = row.dataset.note;
    }
    count();
  });
  count();
</script>
</body>
</html>
