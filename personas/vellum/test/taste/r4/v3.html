<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Workout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --field:#2f3cff;
    --field-deep:#1f28c9;
    --on-field:#ffffff;
    --on-field-soft:#c9ccff;
    --sheet:#ffffff;
    --ink:#0e1030;
    --soft:#666a86;
    --chip:#eef0ff;
    --done:#0e1030;
    --lime:#d6ff4a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:#111}
  body{width:390px;min-height:844px;margin:0 auto;background:var(--field);color:var(--ink);font-family:"Figtree",system-ui,sans-serif;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
  .status{display:flex;justify-content:space-between;padding:14px 26px 0;font-size:14px;font-weight:700;color:var(--on-field)}

  .field{position:relative;z-index:1;padding:18px 22px 0;color:var(--on-field)}
  .drain{position:absolute;top:0;right:0;width:20%;height:364px;background:var(--field-deep);z-index:0}
  .drain::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--lime)}
  .drain span{position:absolute;left:10px;top:334px;font-size:12px;font-weight:800;letter-spacing:.04em;color:var(--on-field-soft)}
  .status{position:relative;z-index:2}
  .field > *{position:relative;z-index:1}
  .bar{display:flex;justify-content:space-between;align-items:center}
  .pill{font-size:13px;font-weight:700;background:rgba(255,255,255,.14);padding:8px 12px;border-radius:99px}
  .pill span{opacity:.7;font-weight:600}
  .x{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:15px;font-weight:700}

  .restlbl{margin-top:32px;font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--lime)}
  .clock{font-family:"Unbounded";font-weight:900;font-size:128px;line-height:.95;letter-spacing:-.05em;margin:6px 0 0 -4px;font-variant-numeric:tabular-nums}
  .sub{display:flex;gap:10px;margin-top:18px}
  .sub .s{font-size:14px;font-weight:600;background:rgba(255,255,255,.14);padding:10px 14px;border-radius:14px}
  .sub .s b{font-weight:800}

  .sheet{position:absolute;left:0;right:0;top:364px;bottom:0;background:var(--sheet);border-radius:34px 34px 0 0;padding:24px 20px 0}
  .ex{display:flex;justify-content:space-between;align-items:flex-start}
  .ex h1{font-family:"Unbounded";font-weight:700;font-size:26px;letter-spacing:-.03em;line-height:1.05}
  .ex p{font-size:14px;color:var(--soft);font-weight:600;margin-top:6px}
  .form{flex:none;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;background:var(--chip);color:var(--field);padding:9px 12px;border-radius:99px}
  .form i{width:18px;height:18px;border-radius:50%;background:var(--field);color:#fff;font-style:normal;display:grid;place-items:center;font-size:10px}

  .sets{display:flex;gap:8px;margin-top:18px}
  .set{flex:1;height:58px;border-radius:18px;background:var(--chip);display:flex;flex-direction:column;justify-content:center;align-items:center;font-weight:800;font-size:16px}
  .set small{font-size:11px;font-weight:700;color:var(--soft);letter-spacing:.04em}
  .set.done{background:var(--done);color:#fff}
  .set.done small{color:var(--lime)}
  .set.now{background:#fff;box-shadow:inset 0 0 0 2.5px var(--field);color:var(--field)}
  .set.now small{color:var(--field)}
  .set.later{color:#7c80a0}

  .adj{display:flex;gap:8px;margin-top:10px}
  .a{flex:1;display:flex;align-items:center;justify-content:space-between;background:var(--chip);border-radius:18px;height:64px;padding:0 6px}
  .a .pm{width:44px;height:52px;display:grid;place-items:center;font-size:24px;font-weight:600;color:var(--field)}
  .a .v{text-align:center;line-height:1}
  .a .v strong{font-family:"Unbounded";font-weight:700;font-size:24px;letter-spacing:-.03em}
  .a .v small{display:block;font-size:11px;color:var(--soft);font-weight:700;margin-top:4px}

  .go{position:absolute;left:14px;right:14px;bottom:30px;height:96px;border-radius:30px;background:var(--lime);display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 26px}
  .go .t{font-family:"Unbounded";font-weight:900;font-size:26px;letter-spacing:-.03em;color:var(--ink);line-height:1}
  .go .t small{display:block;font-family:"Figtree";font-weight:700;font-size:15px;letter-spacing:0;margin-top:6px;color:#3a4a00}
  .go .ck{width:68px;height:68px;border-radius:22px;background:var(--ink);color:var(--lime);display:grid;place-items:center;font-size:30px;font-weight:800}
  .cue{margin-top:16px;font-size:15px;line-height:1.45;color:#3d4163}
  .cue b{color:var(--ink);font-weight:800}
  .then{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:14px;border-top:1.5px solid var(--chip);font-size:14px;color:var(--soft);font-weight:600}
  .then b{color:var(--ink);font-weight:800}
  .home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--ink);opacity:.3;z-index:3}
</style>
</head>
<body>
  <div class="drain"><span>0:18 gone</span></div>
  <div class="status"><span>6:42</span><span>82%</span></div>

  <section class="field">
    <div class="bar"><span class="pill">Push A <span>· 34 min</span></span><span class="x">II</span></div>
    <div class="restlbl">Rest</div>
    <div class="clock">1:12</div>
    <div class="sub">
      <span class="s">of <b>1:30</b></span>
      <span class="s">Next <b>80 kg × 6</b></span>
    </div>
  </section>

  <section class="sheet">
    <div class="ex">
      <div><h1>Bench press</h1><p>2 of 5 · last week 77.5 × 6</p></div>
      <span class="form"><i>▶</i>Form</span>
    </div>
    <div class="sets">
      <div class="set done"><small>SET 1 ✓</small>80×6</div>
      <div class="set done"><small>SET 2 ✓</small>80×6</div>
      <div class="set now"><small>SET 3</small>80×6</div>
      <div class="set later"><small>SET 4</small>80×6</div>
    </div>
    <div class="adj">
      <div class="a"><span class="pm">−</span><span class="v"><strong>80</strong><small>kg</small></span><span class="pm">+</span></div>
      <div class="a"><span class="pm">−</span><span class="v"><strong>6</strong><small>reps</small></span><span class="pm">+</span></div>
    </div>
    <p class="cue"><b>Cue:</b> blades back, feet planted, bar to low chest.</p>
    <div class="then"><span>Then <b>Overhead press</b> · 3 × 8</span><span>+2.5 kg on last week</span></div>
  </section>

  <div class="go"><span class="t">Log set 3<small>80 kg × 6</small></span><span class="ck">✓</span></div>
  <div class="home"></div>
</body>
</html>
